<h4>1 · Coding Practices</h4>
<p>Commençons par quelques pratiques de codage clés qui favorisent un meilleur développement.</p>
<div class="cards-3">
  <div class="mini-card"><h4>Code Readability</h4><p>Écrire du code <strong>facile</strong> à comprendre, naviguer et maintenir. Un code clair et lisible réduit la confusion et minimise les risques d'erreur lors des mises à jour ou des changements.</p></div>
  <div class="mini-card"><h4>Naming Conventions</h4><p>Utiliser des noms <strong>descriptifs et cohérents</strong> pour les variables, fonctions et classes. Cela rend le code auto-explicatif et améliore la collaboration entre membres de l'équipe.</p></div>
  <div class="mini-card"><h4>Modular Design</h4><p>Décomposer le logiciel en <strong>composants plus petits et réutilisables</strong> (fonctions). Non seulement le code est plus facile à maintenir, mais cela permet aussi une montée en charge plus fluide à mesure que le projet grandit.</p></div>
</div>
<div class="callout">Vous pouvez utiliser des outils de <strong>linting</strong> pour aider à faire respecter ces pratiques. Les outils de linting analysent automatiquement votre code à la recherche d'erreurs potentielles, d'incohérences et de violations de style. Bien qu'ils soient <em>hors du périmètre de ce cours</em>, ce sont d'excellentes ressources pour améliorer la qualité du code et maintenir la lisibilité.</div>

<h4>2 · Document Code</h4>
<p>Une autre bonne pratique importante est de <strong>documenter son code</strong>. Une bonne documentation améliore :</p>
<ul>
<li><strong>Improves Code Maintainability</strong> — la capacité à maintenir votre code. Une documentation claire aide les développeurs à comprendre l'objectif et la fonctionnalité du code, rendant les mises à jour et corrections de bugs plus rapides et faciles.</li>
<li><strong>Enhances Collaboration</strong> — un code bien documenté permet aux membres de l'équipe de monter en compétence rapidement, réduisant les malentendus et les erreurs.</li>
<li><strong>Facilitates Knowledge Transfer</strong> — documenter son code préserve les informations clés sur la conception et la structure, assurant des transitions fluides lors des changements d'équipe.</li>
</ul>

<h4>3 · Automated Testing</h4>
<p>Le test est un composant <strong>extrêmement critique</strong> des bonnes pratiques de développement logiciel. Écrire à la fois des tests unitaires et des tests d'intégration est essentiel pour vérifier que les composants individuels <em>et</em> leurs interactions fonctionnent correctement.</p>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px">
<div style="background:#1c232d;border:1px solid #2b3542;border-left:3px solid #ff4a2e;border-radius:9px;padding:13px">
<div style="font-family:'Space Grotesk',sans-serif;font-size:12.5px;font-weight:600;color:#ff6a52;margin-bottom:6px">1. Unit Tests</div>
<p style="font-size:13px;margin:0">Vérifie la fonctionnalité d'une <strong>unité unique</strong> en isolation — typiquement un seul composant de code, pour s'assurer qu'il se comporte comme attendu.</p>
</div>
<div style="background:#1c232d;border:1px solid #2b3542;border-left:3px solid #e3b23c;border-radius:9px;padding:13px">
<div style="font-family:'Space Grotesk',sans-serif;font-size:12.5px;font-weight:600;color:#e3b23c;margin-bottom:6px">2. Integration Tests</div>
<p style="font-size:13px;margin:0">Teste comment <strong>différents</strong> composants ou systèmes fonctionnent ensemble, pour s'assurer qu'ils fonctionnent correctement <em>dans leur ensemble</em>.</p>
</div>
</div>

<h4>4 · Version Control and Code Review</h4>
<ul>
<li><strong>Version Control</strong> — des outils comme <strong>Git</strong> sont essentiels pour suivre les changements, collaborer avec les membres de l'équipe et maintenir un historique du codebase. Ils permettent de <strong>revenir en arrière</strong>, de gérer plusieurs versions et d'éviter les conflits, tout en gardant votre travail organisé et sécurisé.</li>
<li><strong>Code Review</strong> — aide à <strong>détecter les bugs tôt</strong> et à garantir le respect des standards de codage. Combinées au version control, les revues de code améliorent la qualité et la cohérence, favorisent la collaboration, encouragent le partage de connaissances au sein de l'équipe et mènent à un code plus maintenable et fiable.</li>
</ul>
<p>En résumé : utilisez le version control pour gérer efficacement votre codebase, et les revues de code pour améliorer la qualité de votre code par la collaboration.</p>

<h4>5 · CI/CD</h4>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px">
<div style="background:#1c232d;border:1px solid #2b3542;border:1.5px dashed #3fcf8e;border-radius:9px;padding:13px">
<div style="font-family:'Space Grotesk',sans-serif;font-size:12.5px;font-weight:600;color:#3fcf8e;margin-bottom:6px">Continuous Integration (CI)</div>
<p style="font-size:13px;margin:0 0 8px">Une pratique où les développeurs <strong>commitent, buildent, testent</strong> et <strong>releasent du code</strong> fréquemment vers un <strong>dépôt partagé</strong>. L'objectif est de détecter les problèmes tôt grâce à l'intégration et aux tests continus.</p>
<div style="background:#e3b23c;color:#0d1014;border-radius:5px;padding:6px 10px;font-size:12px;text-align:center;font-weight:600">Main focus of this course</div>
</div>
<div style="background:#1c232d;border:1.5px solid #ff4a2e;border-radius:9px;padding:13px">
<div style="font-family:'Space Grotesk',sans-serif;font-size:12.5px;font-weight:600;color:#ff6a52;margin-bottom:6px">Continuous Deployment (CD)</div>
<p style="font-size:13px;margin:0"><strong>Automatiser la mise en production</strong> du code après le passage des tests automatisés (tests unitaires et d'intégration). L'objectif est de livrer fonctionnalités et correctifs rapidement et de façon cohérente, en évitant les erreurs.</p>
</div>
</div>
<p>Ce cours se concentre principalement sur la <strong>Continuous Integration</strong> au sein du pipeline CI/CD, avec une vue d'ensemble de haut niveau du continuous deployment et de la continuous delivery.</p>

<h4>6 · Isolated Environments</h4>
<p>Enfin, vous <strong>ne voulez pas modifier le code directement sur le codebase de production</strong>. Les organisations utilisent souvent des environnements différents pour chaque étape. Une configuration typique inclut « <strong>Development &amp; Stage</strong> » et « <strong>Production</strong> », mais cela peut varier selon les processus de votre organisation.</p>
<p>Des environnements séparés aident à <strong>isoler les changements</strong> et à garantir des tests approfondis avant le déploiement, empêchant les problèmes liés au mélange développement/production.</p>

<p>Dans cette leçon, nous voyons comment <strong>modulariser le code PySpark</strong> et explorons les bénéfices de cette démarche.</p>

<h4>Non-Modularized Code (Before)</h4>
<div style="display:grid;grid-template-columns:1.1fr 1fr;gap:14px;align-items:start;margin-bottom:14px">
<pre style="margin:0"><code># Load data
df = (spark
     .read
     .csv("health.csv",
          header=True,
          inferSchema=True))

# Create column
df = (
 df
 .withColumn("NewColumn",
  when(col("Column") == 0, 'Normal')
  .otherwise('Unknown'))
)</code></pre>
<div>
<p style="margin:0 0 6px"><strong>Issues</strong></p>
<ul style="margin:0">
<li>Tout est dans <strong>un seul bloc</strong>, rendant plus difficile la modification ou le test de parties spécifiques (par ex. le chargement des données, l'ajout de nouvelles colonnes).</li>
<li>De la <strong>duplication de code</strong> peut survenir si les mêmes opérations sont nécessaires ailleurs dans le projet.</li>
</ul>
</div>
</div>
<p>Qui n'a jamais écrit du code comme celui-ci ? Du code réparti sur plusieurs lignes ou cellules, où l'on écrit systématiquement une logique spécifique pour transformer, préparer ou analyser ses données. À mesure que le flux se construit, le code devient <strong>difficile à lire et ingérable</strong>.</p>
<p>Cette approche peut fonctionner, mais elle crée plusieurs difficultés au moment d'implémenter le <strong>CI/CD</strong> dans votre processus de développement. Le problème de la duplication est particulièrement coûteux : <em>quand une chose change dans votre logique, vous devez la changer partout</em>.</p>

<h4>Modularized Code (After)</h4>
<p>À la place, vous voulez vous concentrer sur la <strong>modularisation</strong> de votre code.</p>
<pre><code>def load_data(file_path):
    return (spark
            .read
            .csv(file_path,
                 header=True,
                 inferSchema=True))


def add_new_col(df, new, s_col):
    return (df
            .withColumn(new,
                when(col(s_col) == 0, 'Normal')
                .otherwise('Unknown')))</code></pre>
<ul>
<li>Le code écrit pour lire le fichier CSV dans un Spark DataFrame peut être transformé en une fonction, telle que <code>def load_data()</code>.</li>

<p>Le <strong>DevOps</strong> est une <strong>culture et un ensemble de pratiques</strong> qui combine les <strong>bonnes pratiques de génie logiciel</strong> avec les <strong>opérations IT</strong> pour livrer du logiciel plus rapidement, plus efficacement et avec une qualité supérieure. Il s'agit avant tout de favoriser la collaboration entre les équipes de développement et d'opérations pour <strong>automatiser vos Lakeflow Jobs</strong>, fluidifier les processus et garantir la livraison continue des applications.</p>

<li>Fiabilité système accrue ;</li>
<li>Meilleure scalabilité et efficacité.</li>
</ul>
<p>En bref, le DevOps est une façon de <strong>construire et livrer du logiciel rapidement et de manière fiable</strong>, en comblant le fossé entre le développement et les opérations.</p>

<li><strong>Code</strong> — les développeurs écrivent le code source de l'application, construisant les fonctionnalités nécessaires.</li>
<li><strong>Build</strong> — on compile le code en <strong>fichiers exécutables</strong>, en s'assurant que toutes les dépendances sont correctement intégrées.</li>
<li><strong>Test</strong> — on exécute des <strong>tests automatisés</strong> pour s'assurer que le code fonctionne comme attendu, en attrapant les bugs avant la release. <em>Le test est extrêmement important dans le DevOps.</em></li>
<li><strong>Release</strong> — on package l'application en s'assurant qu'elle est <strong>prête pour la production</strong>, et on prépare un déploiement contrôlé.</li>
<li><strong>Deploy</strong> — on pousse l'application vers l'environnement de production et on la rend disponible aux utilisateurs.</li>
<li><strong>Operate</strong> — on opère l'application : monitorer la performance, gérer ses ressources et traiter rapidement les problèmes qui surviennent.</li>

<p><strong>Les tests qui échouent n'entrent pas dans votre code source.</strong> La façon dont les tests et les commits vers le version control sont implémentés dépend de la <strong>stratégie de branches</strong> définie par votre organisation. <em>Décider d'une stratégie de branching et de test est extrêmement important.</em></p>
<p><strong>Quatre bénéfices clés de la Continuous Integration :</strong></p>
<ul>
<li><strong>Early Detection of Issues</strong> — en intégrant le code souvent, les bugs et conflits sont détectés tôt, ce qui les rend plus faciles à corriger.</li>
<li><strong>Faster Development Cycle</strong> — l'intégration fréquente accélère la livraison de nouvelles fonctionnalités et corrections.</li>
<li><strong>Improved Collaboration and Code Quality</strong> — l'intégration régulière conduit à un code plus propre, plus modulaire et à un meilleur travail d'équipe.</li>
<li><strong>Automated Testing and Validation</strong> — des tests automatisés s'exécutent à chaque intégration pour garantir que le code est stable et fonctionne avec les fonctionnalités existantes.</li>
</ul>
<p>Ces bénéfices — détection précoce des problèmes, livraison plus rapide, meilleure collaboration et tests automatisés — rendent la Continuous Integration <strong>essentielle à un développement fluide</strong>.</p>

<h4>High-level Testing Steps — la pyramide de tests</h4>
<p>Au sein du CI/CD, il existe des étapes de test à suivre dans ce qu'on appelle la <strong>testing pyramid</strong>. La pyramide de tests catégorise les différents tests : <strong>unit tests, integration tests et system tests</strong>.</p>
<svg viewBox="0 0 700 210" style="width:100%;height:auto;background:#1c232d;border:1px solid #2b3542;border-radius:9px;margin-bottom:14px" xmlns="http://www.w3.org/2000/svg">

  <text x="326" y="114" style="font-family:'Inter',sans-serif;font-size:10.5px;fill:#c9d3e0">· <tspan font-weight="700" fill="#e8ecf2">Ex:</tspan> Notebooks / SDP / Jobs interactions</text>

  <text x="326" y="166" style="font-family:'Inter',sans-serif;font-size:10.5px;fill:#c9d3e0">· Fast, low cost, high coverage, and automated</text>
  <text x="326" y="183" style="font-family:'Inter',sans-serif;font-size:10.5px;fill:#c9d3e0">· <tspan font-weight="700" fill="#e8ecf2">Ex:</tspan> Custom pyspark functions</text>

<ul>
<li><strong>Unit Tests (base de la pyramide)</strong> — testent des fonctions ou méthodes individuelles <strong>en isolation</strong>. Comme ce sont de petites fonctions individuelles, elles s'exécutent typiquement <strong>rapidement, fréquemment et automatiquement</strong>. Les tests unitaires forment la fondation parce qu'ils sont <strong>peu coûteux</strong> et fournissent la <strong>couverture la plus large</strong>. Exemple : tester qu'une méthode PySpark fonctionne comme attendu.</li>
<li><strong>Integration Tests</strong> — testent l'interaction entre différents composants ou systèmes. Ils sont typiquement <strong>plus lents et plus coûteux</strong> que les tests unitaires, mais donnent une plus grande assurance que les composants fonctionnent correctement ensemble. Dans Databricks, ils tournent typiquement autour des <strong>Notebooks, de SDP et/ou des Lakeflow Jobs</strong>. Exemple : tester qu'une méthode PySpark et un SDP fonctionnent correctement ensemble.</li>
<li><strong>System Tests</strong> — testent <strong>toute l'application</strong>, en s'assurant que toutes les parties fonctionnent ensemble dans un scénario réel. Ils sont typiquement <strong>lents, coûteux</strong> et souvent exécutés dans un environnement proche de la production. Exemple : pour notre pipeline de données de bout en bout, tester que le pipeline fonctionne comme attendu au sein d'un Job, en produisant les résultats souhaités.</li>
</ul>`

<p>La Continuous Delivery consiste à <strong>automatiser le processus de push des changements vers le staging ou la pré-production</strong>. Cette configuration permet des mises à jour sans couture et offre la <strong>flexibilité de déployer manuellement en production quand c'est nécessaire</strong>, garantissant des releases fluides et contrôlées. Par exemple : une fois les étapes de continuous integration terminées et les tests effectués, <strong>nous pouvons décider</strong> de déployer notre pipeline de données en production.</p>

<p>Par exemple : si vos processus de continuous integration sont alignés et bien implémentés, nous pouvons déployer automatiquement notre pipeline de données du développement au staging, puis à la production, en évitant les étapes de déploiement manuelles. <strong>Implémenter cette technique exige des tests bien pensés</strong> pour s'assurer que le pipeline doit bien être déployé.</p>

<p>Dans ce projet, nous créons <strong>un catalogue par environnement</strong> : dev, stage et prod.</p>
<ul>
<li>Le catalogue <strong>dev</strong> contiendra un <strong>petit sous-ensemble statique</strong> de nos données de production, utilisé pour le développement et les tests initiaux.</li>
<li>Le catalogue <strong>stage</strong> contiendra un <strong>sous-ensemble plus large</strong> des données de production, permettant des tests plus complets à mesure que nous avançons dans le processus CI/CD.</li>
<li>Enfin, le catalogue <strong>prod</strong> contiendra les <strong>données de production vivantes</strong> sur lesquelles nous nous appuyons pour les opérations finales.</li>
</ul>
<p>Notre workflow commence par développer sur les données de dev, en exécutant des <strong>tests unitaires et d'intégration</strong> à mesure que nous progressons dans le pipeline. Le pipeline est mis en place avec des <strong>Databricks Lakeflow Jobs</strong>, qui exécutent les tests unitaires, le Spark Declarative Pipeline et les visualisations finales. En testant le pipeline à chaque étape, nous nous assurons que tout fonctionne correctement <strong>avant de déployer en production</strong>.</p>`

        html: `
<p>Dans cette leçon, vous apprendrez à écrire et exécuter des tests unitaires pour PySpark en utilisant <code>pyspark.testing.utils</code> et <code>pytest</code>, en explorant leurs bénéfices, fonctions clés et exemples pratiques pour garantir la qualité et la fiabilité du code.</p>

<h4>UNIT TESTS Benefits</h4>
<ul>
<li>Tester <strong>une seule fonction spécifique</strong>, sur un <strong>petit volume de données</strong> — ce qui rend l'isolation des problèmes facile.</li>
<li><strong>Attraper les bugs avant de les déployer</strong> dans votre projet — cela fait gagner du temps et réduit les erreurs.</li>
<li>Le <strong>refactoring de votre code est plus facile</strong>, puisque vous pouvez garantir que vos changements ne cassent rien.</li>
<li>Les tests rendent votre <strong>débogage plus facile</strong>, en pointant exactement où les choses tournent mal.</li>
</ul>
<div class="callout">En bref, les tests unitaires sont <strong>essentiels pour garder votre code fiable et facile à maintenir</strong>.</div>

<h4>Pyspark.testing.utils — fonctions de test</h4>
<p><code>pyspark.testing.utils</code> fournit des <strong>fonctions utilitaires</strong> pour faciliter les tests unitaires en PySpark. Les utilitaires de test intégrés de PySpark simplifient le processus, en particulier pour tester les transformations et actions Spark.</p>
<table class="tbl">
<thead><tr><th style="width:46%">Fonction</th><th>Rôle</th></tr></thead>
<tbody>
<tr><td><code>assertDataFrameEqual(actual, expected[, …])</code></td><td>Fonction utilitaire pour vérifier l'<strong>égalité entre un DataFrame réel et un DataFrame attendu</strong>, avec des paramètres optionnels.</td></tr>
<tr><td><code>assertSchemaEqual(actual, expected)</code></td><td>Fonction utilitaire pour vérifier l'<strong>égalité entre les schémas</strong> de DataFrames réel et attendu.</td></tr>
</tbody>
</table>
<div class="callout">Il existe une <strong>variété d'autres méthodes</strong> pour exécuter vos tests unitaires ; nous nous concentrons ici sur les <strong>pyspark testing utils</strong>.<br/><em>Documentation : Testing — PySpark 4.0.1 documentation.</em></div>

<h4>Unit Test Example</h4>
<p><strong>1. Vous avez la fonction suivante qui crée une colonne :</strong></p>
<pre><code>from pyspark.sql.functions import col, when

def add_new_col(df, new, s_col):
    return (df
            .withColumn(new,
                when(col(s_col) == 0, 'Normal')
                .otherwise('Unknown')))</code></pre>
<p><strong>2. Vos résultats souhaités :</strong></p>
<table class="tbl" style="max-width:320px">
<thead><tr><th><code>original</code></th><th><code>desired</code></th></tr></thead>
<tbody>
<tr><td><code>0</code></td><td><code>Normal</code></td></tr>
<tr><td><code>1</code></td><td><code>Unknown</code></td></tr>
<tr><td><code>-1</code></td><td><code>Unknown</code></td></tr>
<tr><td><code>null</code></td><td><code>Unknown</code></td></tr>
</tbody>
</table>

<h4>Unit Test Goal</h4>
<div class="callout">Comparer le <strong>résultat réel</strong> de la fonction avec un <strong>résultat attendu défini</strong>.</div>
<p><strong>3. Créer le test unitaire :</strong></p>
<pre><code>def test_add_new_col():
    data = [(0,), (1,), (-1,), (None,)]
    columns = ["value"]
    df = spark.createDataFrame(data, columns)

    actual_df = add_new_col(df, "new_value", "value")

    expected_data = [(0, 'Normal'), (1, 'Unknown'),
                     (-1, 'Unknown'), (None, 'Unknown')]
    expected_df = spark.createDataFrame(expected_data,
                                        ["value", "new_value"])

    assertDataFrameEqual(actual_df, expected_df)</code></pre>
<table class="tbl">
<thead><tr><th style="width:44%">Ligne de code</th><th>Ce qu'elle fait</th></tr></thead>
<tbody>
<tr><td><code>def test_add_new_col():</code></td><td>Créer une <strong>fonction de test unitaire</strong> pour tester la fonction. Nommer la fonction de test en conséquence.</td></tr>
<tr><td><code>data = [...]</code> / <code>df = spark.createDataFrame(...)</code></td><td>Créer un <strong>DataFrame d'échantillon</strong> pour tester tous les cas d'usage auxquels vous pouvez penser.</td></tr>
<tr><td><code>actual_df = add_new_col(...)</code></td><td><strong>Exécuter votre fonction</strong> sur les données d'échantillon et stocker le résultat.</td></tr>
<tr><td><code>expected_data</code> / <code>expected_df</code></td><td>Créer un <strong>DataFrame de résultat attendu</strong> à partir des données d'échantillon.</td></tr>
<tr><td><code>assertDataFrameEqual(actual_df, expected_df)</code></td><td><strong>Comparer les deux DataFrames</strong>. S'ils ne sont pas identiques, une <strong>erreur sera renvoyée</strong>.</td></tr>
</tbody>
</table>
<p>Un processus CI/CD bien implémenté permet des releases <strong>plus rapides et plus fiables</strong>, réduit les erreurs en production grâce aux tests automatisés, et facilite les <strong>rollbacks</strong> avec des pratiques de déploiement sûres.</p>

<h4>Unit Testing Framework — pytest</h4>
<p><strong>Pytest</strong> est un framework de test populaire pour Python qui rend facile l'écriture de <strong>cas de test simples et scalables</strong>. Il apporte une variété de bénéfices pour exécuter vos tests unitaires.</p>
<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:14px">
<div style="background:#1c232d;border:1px solid #2b3542;border-radius:9px;padding:13px">
<div style="font-family:'Space Grotesk',sans-serif;font-size:12.5px;font-weight:600;color:#e8ecf2;margin-bottom:6px">Uses Simple Syntax</div>
<p style="font-size:13px;margin:0">Syntaxe minimale : définir simplement des fonctions commençant par <strong><code>test_</code></strong>. Pas de configuration complexe à gérer — pytest les détecte et les exécute automatiquement.</p>
</div>
<div style="background:#1c232d;border:1px solid #2b3542;border-radius:9px;padding:13px">
<div style="font-family:'Space Grotesk',sans-serif;font-size:12.5px;font-weight:600;color:#e8ecf2;margin-bottom:6px">Provides Assertions</div>
<p style="font-size:13px;margin:0">Utiliser des instructions <strong><code>assert</code></strong> pour fournir des <strong>messages d'erreur détaillés</strong> en cas d'échec. Pytest s'appuie sur les <code>assert</code> intégrés de Python (ou d'autres, comme ceux de PySpark), ce qui rend le débogage bien plus rapide.</p>
</div>
<div style="background:#1c232d;border:1px solid #2b3542;border-radius:9px;padding:13px">
<div style="font-family:'Space Grotesk',sans-serif;font-size:12.5px;font-weight:600;color:#e8ecf2;margin-bottom:6px">Automatic Discovery</div>
<p style="font-size:13px;margin:0">Trouve et exécute tous les tests <strong>automatiquement</strong> avec une configuration simple. Nommez simplement vos fichiers et fonctions de test avec le préfixe <code>test_</code>, et pytest s'occupe du reste.</p>
</div>
<div style="background:#1c232d;border:1px solid #2b3542;border-radius:9px;padding:13px">
<div style="font-family:'Space Grotesk',sans-serif;font-size:12.5px;font-weight:600;color:#e8ecf2;margin-bottom:6px">Rich Ecosystem</div>
<p style="font-size:13px;margin:0"><strong>Étendre</strong> les fonctionnalités avec des <strong>plugins</strong> pour la couverture, les tests parallèles, et plus encore. Que vous ayez besoin de rapports de couverture, d'exécution parallèle ou d'intégration avec d'autres outils, il existe un plugin pour presque tout.</p>
</div>
</div>
<div class="callout">Ce cours fournit une <strong>introduction simple à pytest</strong>. Il existe de nombreux frameworks de test disponibles : <strong>sélectionnez celui qui répond le mieux aux besoins de votre organisation</strong>.</div>`

<p>Le <strong>version control Git</strong> est important parce qu'il fournit une manière <strong>structurée de gérer, suivre et collaborer</strong> sur les changements de code dans les projets logiciels. C'est fondamentalement un <strong>outil essentiel du développement logiciel moderne et du DevOps</strong>.</p>

<h4>Complications with Version Control — Organizational Challenges</h4>
<ul>
<li>Des <strong>silos</strong> se forment au fil du temps, isolant le développement et les opérations d'équipe.</li>
<li>Le <strong>développement indépendant</strong> conduit à une qualité de développement logiciel plus faible, par manque de version control centralisé (<strong>code dupliqué, standards incohérents, revue de code</strong>, etc.).</li>
<li><strong>Versionnage instable</strong> — il peut devenir difficile de <strong>tracer, annuler (revert) et auditer</strong> les changements.</li>
<li>Sans version control approprié, gérer des <strong>mises à jour fréquentes augmente le risque</strong>.</li>
<li>Le <strong>branching, le merging et l'intégration CI/CD</strong> peuvent devenir difficiles, ce qui <strong>diminue la capacité à faire passer le développement à l'échelle</strong>.</li>
</ul>
<div class="callout">En résumé : l'absence de version control centralisé mène à des silos de développement, entraînant du code dupliqué, des standards incohérents et une qualité logicielle moindre. Un versionnage instable rend le suivi, le revert et l'audit des changements difficiles, augmentant les risques lors de la gestion de mises à jour fréquentes. De plus, le branching, le merging et l'intégration CI/CD deviennent ardus, <strong>limitant au final la scalabilité</strong>.</div>

<h4>Secure code changes through branching</h4>
<ul>
<li>Concept <strong>complémentaire au CI/CD</strong> → <strong>permet une CI efficace</strong>.</li>
<li><strong>Versionner les changements</strong> et les faire passer par un <strong>contrôle qualité avant de fusionner</strong> dans la branche <code>main</code> et de déployer.</li>

<h4>Overview of Git with Databricks</h4>
<p><strong>Git</strong> est un framework logiciel <strong>libre et open-source</strong> conçu pour <strong>suivre les changements du code source</strong> pendant le développement logiciel.</p>
<div class="cards-3">

<h4>Generating GitHub Personal Access Token (PAT) — Authentication</h4>
<p>Pour générer un <strong>Personal Access Token (PAT)</strong> dans GitHub :</p>

<li>choisir soit les tokens <strong>fine-grained</strong>, soit les tokens <strong>classic</strong> ;</li>

<li>configurer les <strong>permissions de dépôt requises</strong>, copier le token, et l'utiliser dans Databricks pour l'intégration.</li>
</ol>

<h4>Connecting to Databricks with GitHub PAT — Seamless Integration</h4>

<p>Les <strong>DABs</strong> sont conçus pour faciliter l'adoption des bonnes pratiques de génie logiciel, en particulier pour les projets data et IA. Voici les <strong>4 composants centraux</strong> des pratiques SWE supportés par les DABs :</p>
<ul>
<li><strong>Version Control</strong> — comment suivons-nous les changements et maintenons-nous un historique des modifications de code ?</li>
<li><strong>Code Review</strong> — comment maintenons-nous la qualité du code et respectons-nous les standards de codage ?</li>
<li><strong>Testing</strong> — notre comportement de codage est-il cohérent et prévisible ?</li>
<li><strong>Continuous Integration</strong> — automatisons-nous les différents processus d'intégration des changements de code dans notre dépôt ?</li>
</ul>
<p>Les Declarative Automation Bundles fournissent une <strong>approche structurée</strong> pour gérer les projets Databricks tout en respectant les bonnes pratiques de génie logiciel. En combinant les <strong>principes d'infrastructure-as-code</strong> avec des capacités d'automatisation, ils fluidifient la collaboration, améliorent l'assurance qualité et permettent une livraison efficace de solutions pilotées par la donnée :</p>
<ul>
<li>Les DABs s'intègrent sans couture aux <strong>Lakeflow Jobs basés sur Git</strong>, permettant aux utilisateurs de <strong>versionner leurs ressources Databricks aux côtés du code source</strong>.</li>
<li>En traitant les ressources Databricks <strong>comme du code</strong>, les DABs permettent la <strong>revue par les pairs</strong> via les workflows Git standards comme les <em>pull requests</em>.</li>
<li>Les développeurs peuvent utiliser la <strong>Databricks CLI</strong> avec les DABs pour <strong>exécuter des tests sur les bundles dans des environnements isolés</strong>, garantissant que les Lakeflow Jobs se comportent comme prévu.</li>
<li>Les DABs s'intègrent aux outils CI/CD comme <strong>GitHub Actions</strong> ou <strong>Azure DevOps</strong> pour automatiser la <strong>validation, le déploiement et l'exécution</strong> des Lakeflow Jobs Databricks.</li>
</ul>

<h4>What are DABs ?</h4>
<div class="cards-3">
  <div class="mini-card"><h4>Write code once, deploy everywhere</h4><p>Des fichiers <strong>YAML</strong> qui spécifient les <strong>artifacts</strong>, <strong>resources</strong> et <strong>configurations</strong> d'un projet Databricks. Cela mène à une configuration aisée d'interactions complexes notebook/pipeline et à la <strong>reproductibilité</strong> de vos Lakeflow Jobs.</p></div>
  <div class="mini-card"><h4>What are Declarative Automation Bundles?</h4><p>Les DABs sont un outil conçu pour <strong>fluidifier ce processus pour les projets Databricks</strong>. Ces bundles <strong>encapsulent toutes les configurations et artefacts nécessaires</strong>.</p></div>
  <div class="mini-card"><h4>How do bundles work?</h4><p>Les bundles fournissent une <strong>définition exacte</strong> des ressources Databricks à utiliser au sein de votre projet, avec support de la <strong>validation</strong> et des <strong>instructions de déploiement</strong>.</p></div>
</div>
<p>Créer du code qui peut être <strong>déployé sur plusieurs environnements sans modification</strong> : cela garantit la cohérence, réduit les erreurs manuelles et accélère la livraison en automatisant les processus de déploiement. Les DABs permettent aux développeurs de définir les ressources Databricks (comme les <strong>jobs, pipelines et notebooks</strong>) sous forme de <strong>fichiers source et de métadonnées au format YAML</strong>.</p>
<div class="callout"><strong>Comment ça marche concrètement :</strong> les DABs fonctionnent en définissant d'abord vos ressources et exigences dans un fichier <code>databricks.yml</code>. Vous <strong>validez ensuite le bundle</strong> en utilisant la <strong>Databricks CLI</strong> et le <strong>déployez</strong> vers le workspace de votre choix. Une fois déployés, les Lakeflow Jobs ou pipelines décrits dans le bundle peuvent être <strong>exécutés</strong>.</div>

<p>Vue de haut niveau de l'architecture pour le développement et le CI/CD avec les DABs :</p>
<ol>
<li>Si vous travaillez <strong>localement</strong>, vous construisez le <strong>Project Bundle</strong> avec votre équipe en utilisant une configuration d'environnement local.</li>
<li>Ensuite, vous effectuez le <strong>version control</strong> avec le <em>project repository</em>, où les utilisateurs committent leurs changements.</li>
<li>Les utilisateurs peuvent <strong>déployer manuellement</strong> pour tester les changements dans leur <strong>workspace de développement</strong>.</li>
<li>Quand les utilisateurs committent des changements, une <strong>notification est déclenchée</strong> pour implémenter le pipeline CI/CD vers le <strong>staging</strong> puis la <strong>production</strong> — le code et les tests d'intégration sont déployés en staging, puis le code est déployé en production <strong>après revue et approbation</strong>.</li>
</ol>
<div class="callout"><strong>En résumé :</strong> les Declarative Automation Bundles (DABs) sont un outil conçu pour <strong>simplifier la gestion et le déploiement des projets data et IA</strong> sur la plateforme Databricks. Ils suivent une approche <strong>Infrastructure-as-Code (IaC)</strong>, permettant aux utilisateurs de définir et gérer les ressources Databricks — jobs, pipelines, notebooks et modèles de machine learning — via des <strong>fichiers de configuration YAML</strong>. Ces bundles fluidifient la collaboration, les tests, le déploiement et le version control à travers les différents environnements.</div>
<div class="callout"><strong>Renommage examen :</strong> les <em>Databricks Asset Bundles</em> sont désignés dans cet examen sous le nom <strong>Declarative Automation Bundles (DABs)</strong>.</div>`

  <script>
/* ============================================================
   Databricks DEA Trainer — logique applicative

(function () {
  "use strict";

  const $ = (s, r = document) => r.querySelector(s);
  const el = (tag, cls, html) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  };

  const state = {
    mode: "course",          // "course" | "full" | "exam"
    activeSection: COURSE[0].id,
    activeModule: MODULES[0].id,
    exam: null               // active exam session
  };

  const sidebar = $("#sidebar");
  const navArea = $("#nav-area");
  const content = $("#content");
  const tbTitle = $("#tb-title");

  /* ---------------- Sidebar ---------------- */
  function renderSidebar() {
    $("#mode-course").classList.toggle("active", state.mode === "course");
    $("#mode-full").classList.toggle("active", state.mode === "full");
    $("#mode-exam").classList.toggle("active", state.mode === "exam");
    navArea.innerHTML = "";

    if (state.mode === "course") {
      navArea.appendChild(el("div", "nav-label", "Résumé — 7 sections d'examen"));
      COURSE.forEach((sec) => {
        const b = el("button", "nav-item" + (sec.id === state.activeSection ? " active" : ""));
        b.innerHTML =
          `<span class="nav-num">${sec.num}</span>` +
          `<span class="tier-dot tier-${sec.tier}"></span>` +
          `<span>${sec.title}</span>` +
          `<span class="nav-w">${sec.weight}%</span>`;
        b.onclick = () => { goToSection(sec.id); closeMobile(); };
        navArea.appendChild(b);
      });
    } else if (state.mode === "full") {
      navArea.appendChild(el("div", "nav-label", "Cours complet — vos 4 modules"));
      MODULES.forEach((mod) => {
        const b = el("button", "nav-item" + (mod.id === state.activeModule ? " active" : ""));
        b.innerHTML =
          `<span class="nav-num">${mod.num}</span>` +
          `<span class="tier-dot tier-${mod.tier}"></span>` +
          `<span>${mod.title}</span>`;
        b.onclick = () => { goToModule(mod.id); closeMobile(); };
        navArea.appendChild(b);
      });
      navArea.appendChild(el("div", "sidebar-foot",
        "Reprise fidèle et exhaustive de vos 4 supports (W1→W4)."));
    } else {
      navArea.appendChild(el("div", "nav-label", "Entraînement"));
      const a = el("button", "nav-item active",
        `<span class="nav-num">EX</span><span>Examen blanc</span>`);
      a.onclick = () => { startExamSetup(); closeMobile(); };
      navArea.appendChild(a);
      navArea.appendChild(el("div", "sidebar-foot",
        "L'examen réel compte 45 questions notées, 90 minutes, score de réussite indicatif ≈ 70%."));
    }
  }

  /* ---------------- Mode switch ---------------- */
  function setMode(m) {
    state.mode = m;
    renderSidebar();
    if (m === "course") renderSection(state.activeSection);
    else if (m === "full") renderModule(state.activeModule);
    else startExamSetup();
  }

  /* ---------------- Course rendering ---------------- */
  function goToSection(id) {
    state.activeSection = id;
    renderSidebar();
    renderSection(id);
    content.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function goToModule(id) {
    state.activeModule = id;
    renderSidebar();
    renderModule(id);
    content.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  /* ---------------- Coloration syntaxique (SQL / Python) ---------------- */
  const HL_KW = new Set([
    "SELECT","FROM","WHERE","AS","CREATE","OR","REFRESH","REPLACE","TABLE","STREAMING",
    "MATERIALIZED","VIEW","TEMPORARY","DROP","IF","EXISTS","INTO","USING","ON","WHEN",
    "MATCHED","NOT","THEN","UPDATE","SET","DELETE","INSERT","VALUES","MERGE","WITH",
    "SCHEMA","EVOLUTION","AND","COPY","FILEFORMAT","FORMAT_OPTIONS","COPY_OPTIONS",
    "COMMENT","TBLPROPERTIES","CONSTRAINT","EXPECT","VIOLATION","ROW","FAIL","GROUP",
    "BY","ORDER","DESC","ASC","INNER","JOIN","LEFT","RIGHT","OUTER","FULL","LIMIT",
    "EXCEPT","DISTINCT","IS","NULL","IN","LIKE","CAST","FLOW","AUTO","CDC","KEYS",
    "APPLY","SEQUENCE","COLUMNS","STORED","SCD","SCHEDULE","EVERY","WEEK","HOUR","DAY",
    "STREAM","CONSTRAINTS","TRUE","FALSE","IMPORT","DEF","RETURN","NONE",
  ]);
  const HL_TYPES = new Set([
    "STRING","INT","BIGINT","DOUBLE","FLOAT","BOOLEAN","TIMESTAMP","DATE","STRUCT",
    "ARRAY","MAP","VARIANT","BINARY","LONG","SMALLINT","DECIMAL","INTEGER",
  ]);
  function escHtml(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function hlCode(text){
    const re = /(\/\*[\s\S]*?\*\/)|(--[^\n]*|#[^\n]*)|('''[\s\S]*?'''|"""[\s\S]*?""")|('(?:[^'\\]|\\.|'')*'|"(?:[^"\\]|\\.)*")|((?<![A-Za-z0-9_])\d+(?:\.\d+)?(?![A-Za-z0-9_.]))|([A-Za-z_][A-Za-z0-9_]*)/g;
    let out = "", last = 0, m;
    while ((m = re.exec(text))) {
      out += escHtml(text.slice(last, m.index));
      last = re.lastIndex;
      if (m[1] || m[2]) out += '<span class="hl-com">' + escHtml(m[1] || m[2]) + '</span>';
      else if (m[3] || m[4]) out += '<span class="hl-str">' + escHtml(m[3] || m[4]) + '</span>';
      else if (m[5]) out += '<span class="hl-num">' + escHtml(m[5]) + '</span>';
      else if (m[6]) {
        const w = m[6], up = w.toUpperCase();
        const isCall = /^\s*\(/.test(text.slice(re.lastIndex));
        if (HL_KW.has(up)) out += '<span class="hl-kw">' + escHtml(w) + '</span>';
        else if (HL_TYPES.has(up) && w === up) out += '<span class="hl-type">' + escHtml(w) + '</span>';
        else if (isCall) out += '<span class="hl-fn">' + escHtml(w) + '</span>';
        else out += escHtml(w);
      }
    }
    out += escHtml(text.slice(last));
    return out;
  }
  function highlightIn(root){
    root.querySelectorAll("pre code").forEach((c) => {
      if (c.dataset.hl) return;
      c.innerHTML = hlCode(c.textContent);
      c.dataset.hl = "1";
    });
  }

  function renderModule(id) {
    const mod = MODULES.find((m) => m.id === id);
    if (!mod) return;
    tbTitle.textContent = mod.num + " · " + mod.title;
    content.innerHTML = "";
    content.appendChild(el("div", "eyebrow",
      `Module ${mod.num} <span class="w">· cours complet</span>`));
    content.appendChild(el("h2", "section-title", mod.title));
    content.appendChild(el("p", "section-sub", mod.subtitle));
    mod.lessons.forEach((les) => {
      const card = el("div", "lesson");
      card.id = les.id;
      card.appendChild(el("h3", null, les.title));
      const body = el("div");
      body.innerHTML = les.html;
      highlightIn(body);
      card.appendChild(body);
      content.appendChild(card);
    });
  }

  function renderSection(id) {
    const sec = COURSE.find((s) => s.id === id);
    if (!sec) return;
    tbTitle.textContent = sec.title;
    content.innerHTML = "";

    content.appendChild(el("div", "eyebrow",
      `Section ${sec.num} <span class="w">· pondération ${sec.weight}%</span>`));
    content.appendChild(el("h2", "section-title", sec.title));
    content.appendChild(el("p", "section-sub", sec.subtitle));

    sec.lessons.forEach((les) => {
      const card = el("div", "lesson");
      card.id = les.id;
      card.appendChild(el("h3", null, les.title));
      const body = el("div");
      body.innerHTML = les.html;
      highlightIn(body);
      card.appendChild(body);
      content.appendChild(card);
    });
  }

  /* ---------------- Review jump (depuis l'examen) ---------------- */
  function jumpToLesson(sid, lid) {
    state.mode = "course";
    state.activeSection = sid;
    renderSidebar();
    renderSection(sid);
    requestAnimationFrame(() => {
      const node = document.getElementById(lid);
      if (node) {
        node.scrollIntoView({ behavior: "smooth", block: "center" });
        node.classList.remove("flash");
        void node.offsetWidth;
        node.classList.add("flash");
      }
    });
  }

  /* ---------------- Exam setup ---------------- */
  function startExamSetup() {
    tbTitle.textContent = "Examen blanc";
    content.innerHTML = "";

    const head = el("div", "exam-head",
      `<h2>Examen blanc</h2><p>Choisissez les sections et le nombre de questions, puis lancez l'entraînement. Correction immédiate et lien vers le cours.</p>`);
    content.appendChild(head);

    const setup = el("div", "setup");
    setup.appendChild(el("h3", null, "1 · Sections à inclure"));

    const grid = el("div", "opt-grid");
    const selected = new Set(COURSE.map((s) => s.id)); // tout par défaut
    COURSE.forEach((sec) => {
      const n = QUESTIONS.filter((q) => q.sid === sec.id).length;
      const chip = el("button", "chip sel",
        `${sec.num} · ${sec.title}<span class="ck">${n} questions · ✓</span>`);
      chip.onclick = () => {
        if (selected.has(sec.id)) { selected.delete(sec.id); chip.classList.remove("sel"); chip.querySelector(".ck").textContent = `${n} questions`; }
        else { selected.add(sec.id); chip.classList.add("sel"); chip.querySelector(".ck").textContent = `${n} questions · ✓`; }
        updateCount();
      };
      grid.appendChild(chip);
    });
    setup.appendChild(grid);

    setup.appendChild(el("h3", null, "2 · Réglages"));
    const row = el("div", "field-row");
    const fCount = el("div", "field",
      `<label>Nombre de questions</label>
       <select id="ex-count">
         <option value="10">10 (rapide)</option>
         <option value="20">20</option>
         <option value="30">30</option>
         <option value="45" selected>45 (format examen)</option>
         <option value="0">Toutes</option>
       </select>`);
    const fOrder = el("div", "field",
      `<label>Ordre</label>
       <select id="ex-order">
         <option value="shuffle" selected>Aléatoire</option>
         <option value="bysection">Par section</option>
       </select>`);
    row.appendChild(fCount); row.appendChild(fOrder);
    setup.appendChild(row);

    const avail = el("p", "qmeta");
    avail.id = "avail-line";
    setup.appendChild(avail);

    const start = el("button", "btn btn-primary", "Démarrer l'examen →");
    start.onclick = () => {
      if (selected.size === 0) return;
      const order = $("#ex-order").value;
      let want = parseInt($("#ex-count").value, 10);
      let pool = QUESTIONS.filter((q) => selected.has(q.sid));
      if (order === "shuffle") pool = shuffle(pool.slice());
      else pool = pool.slice().sort((a, b) => a.sid.localeCompare(b.sid));
      if (want > 0) pool = pool.slice(0, want);
      launchExam(pool);
    };
    setup.appendChild(start);
    content.appendChild(setup);

    function updateCount() {
      const total = QUESTIONS.filter((q) => selected.has(q.sid)).length;
      $("#avail-line").textContent = `${total} questions disponibles dans la sélection`;
      start.disabled = selected.size === 0;
    }
    updateCount();
  }

  /* ---------------- Exam runtime ---------------- */
  function launchExam(questions) {
    state.exam = {
      questions,
      i: 0,
      answers: new Array(questions.length).fill(null),
      revealed: new Array(questions.length).fill(false)
    };
    renderQuestion();
  }

  function renderQuestion() {
    const ex = state.exam;
    const q = ex.questions[ex.i];
    const sec = COURSE.find((s) => s.id === q.sid);
    content.innerHTML = "";

    // progress
    const answered = ex.answers.filter((a) => a !== null).length;
    const prog = el("div");
    prog.appendChild(el("div", "qprogress",
      `<div class="fill" style="width:${((ex.i) / ex.questions.length) * 100}%"></div>`));
    prog.appendChild(el("div", "qmeta",
      `<span>Question ${ex.i + 1} / ${ex.questions.length}</span><span>${answered} répondues</span>`));
    content.appendChild(prog);

    const card = el("div", "qcard");
    card.appendChild(el("div", "qtag",
      `<span class="tier-dot tier-${sec.tier}"></span> Section ${sec.num} · ${sec.title}`));
    card.appendChild(el("div", "qtext", q.q));

    const answers = el("div", "answers");
    const keys = ["A", "B", "C", "D", "E"];
    const chosen = ex.answers[ex.i];
    const revealed = ex.revealed[ex.i];

    q.opts.forEach((opt, idx) => {
      const a = el("button", "answer");
      a.innerHTML = `<span class="key">${keys[idx]}</span><span>${opt}</span>`;
      if (revealed) {
        a.classList.add("locked");
        if (idx === q.a) a.classList.add("correct");
        if (idx === chosen && chosen !== q.a) a.classList.add("wrong");
      } else if (idx === chosen) {
        a.classList.add("sel");
      }
      a.onclick = () => {
        if (ex.revealed[ex.i]) return;
        ex.answers[ex.i] = idx;
        ex.revealed[ex.i] = true;
        renderQuestion();
      };
      answers.appendChild(a);
    });
    card.appendChild(answers);

    // explanation + review link
    const exp = el("div", "explain" + (revealed ? " show" : ""));
    if (revealed) {
      const ok = chosen === q.a;
      exp.appendChild(el("div", "verdict " + (ok ? "ok" : "no"),
        ok ? "✓ Bonne réponse" : "✗ Réponse incorrecte"));
      exp.appendChild(el("p", null, q.exp));
      const lessonTitle = (sec.lessons.find(l => l.id === q.lid) || {}).title || "";
      const link = el("button", "review-link",
        `📖 Revoir : ${sec.title} → ${lessonTitle}`);
      link.onclick = () => jumpToLesson(q.sid, q.lid);
      exp.appendChild(link);
    }
    card.appendChild(exp);
    content.appendChild(card);

    // nav
    const nav = el("div", "exam-nav");
    const prev = el("button", "btn btn-ghost", "← Précédent");
    prev.disabled = ex.i === 0;
    prev.onclick = () => { ex.i--; renderQuestion(); window.scrollTo(0, 0); };

    const isLast = ex.i === ex.questions.length - 1;
    const next = el("button", "btn btn-primary", isLast ? "Voir le résultat →" : "Suivant →");
    next.onclick = () => {
      if (isLast) { showResults(); }
      else { ex.i++; renderQuestion(); window.scrollTo(0, 0); }
    };
    nav.appendChild(prev); nav.appendChild(next);
    content.appendChild(nav);
  }

  /* ---------------- Results ---------------- */
  function showResults() {
    const ex = state.exam;
    tbTitle.textContent = "Résultat";
    let correct = 0;
    const bySec = {};
    ex.questions.forEach((q, i) => {
      const ok = ex.answers[i] === q.a;
      if (ok) correct++;
      if (!bySec[q.sid]) bySec[q.sid] = { ok: 0, n: 0 };
      bySec[q.sid].n++;
      if (ok) bySec[q.sid].ok++;
    });
    const total = ex.questions.length;
    const pct = Math.round((correct / total) * 100);
    const pass = pct >= 70;

    content.innerHTML = "";
    const r = el("div", "result");

    const circ = 2 * Math.PI * 52;
    const off = circ * (1 - pct / 100);
    const ring = el("div", "scorering");
    ring.innerHTML =
      `<svg width="160" height="160" viewBox="0 0 120 120">
         <circle cx="60" cy="60" r="52" fill="none" stroke="#232c38" stroke-width="11"/>
         <circle cx="60" cy="60" r="52" fill="none" stroke="${pass ? '#3fcf8e' : '#ff4a2e'}"
            stroke-width="11" stroke-linecap="round"
            stroke-dasharray="${circ}" stroke-dashoffset="${off}"/>
       </svg>
       <div class="pct"><b>${pct}%</b><span>${correct}/${total}</span></div>`;
    r.appendChild(ring);

    r.appendChild(el("h2", null, pass ? "Prêt·e pour l'examen 🎯" : "Encore un peu d'entraînement"));
    r.appendChild(el("p", "verdict-line",
      pass ? "Vous dépassez le seuil indicatif de 70%. Continuez à réviser les sections les plus faibles."
           : "Sous le seuil indicatif de 70%. Revoyez en priorité les sections ci-dessous."));

    const bs = el("div", "bysec");
    COURSE.forEach((sec) => {
      const d = bySec[sec.id];
      if (!d) return;
      const p = Math.round((d.ok / d.n) * 100);
      const row = el("div", "row");
      row.innerHTML =
        `<span class="tier-dot tier-${sec.tier}"></span>
         <span class="nm">${sec.num} · ${sec.title}</span>
         <span class="bar"><i style="width:${p}%"></i></span>
         <span class="sc">${d.ok}/${d.n}</span>`;
      bs.appendChild(row);
    });
    r.appendChild(bs);

    const review = el("button", "btn btn-ghost", "Revoir les questions");
    review.onclick = () => { ex.i = 0; renderQuestion(); window.scrollTo(0, 0); };
    const again = el("button", "btn btn-primary", "Nouvel examen");
    again.onclick = () => startExamSetup();
    r.appendChild(review); r.appendChild(again);

    content.appendChild(r);
    window.scrollTo(0, 0);
  }

  /* ---------------- utils ---------------- */
  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  /* ---------------- mobile drawer ---------------- */
  function closeMobile() {
    sidebar.classList.remove("open");
    $("#scrim").classList.remove("show");
  }
  $("#burger").onclick = () => {
    sidebar.classList.toggle("open");
    $("#scrim").classList.toggle("show");
  };
  $("#scrim").onclick = closeMobile;

  /* ---------------- wire mode buttons ---------------- */
  $("#mode-course").onclick = () => setMode("course");
  $("#mode-full").onclick = () => setMode("full");
  $("#mode-exam").onclick = () => setMode("exam");

  /* ---------------- init ---------------- */
  renderSidebar();
  renderSection(state.activeSection);
})();

  </script>
</body>
</html>
