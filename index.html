        id: "w2l12", title: "Tâches conditionnelles & itératives",
        html: `
<p>Trois types de tâches avancés permettent des patterns de workflow sophistiqués : <strong>Run if Conditional Task Dependencies</strong>, <strong>If Else Task</strong> et <strong>For Each Task</strong>. Ces tâches transforment vos workflows d'une simple automatisation en systèmes de traitement de données intelligents, capables de <em>brancher</em>, <em>boucler</em> et prendre des décisions selon les données et les résultats de traitement.</p>
<div class="cards-3">
  <div class="mini-card"><h4>Run if Conditional Task Dependencies</h4><p>Contrôler l'exécution d'une tâche selon les <strong>résultats des tâches amont</strong>, permettant de gérer les échecs partiels et les scénarios de dépendances complexes.</p></div>
  <div class="mini-card"><h4>If Else Task</h4><p>Implémenter une <strong>logique conditionnelle booléenne</strong> directement dans le workflow, autorisant des branches selon les conditions de données, résultats de traitement ou règles métier.</p></div>
  <div class="mini-card"><h4>For Each Task</h4><p>Permettre des patterns de <strong>traitement itératif</strong> où la même logique est appliquée à plusieurs partitions de données ou paramètres, avec un <strong>parallélisme configurable</strong>.</p></div>
</div>

<h4>1) Run if — dépendances conditionnelles entre tâches</h4>
<ul>
<li><strong>Contrôle l'exécution d'une tâche selon les résultats des tâches amont</strong> (<em>upstream tasks</em>).</li>
<li>Supporte une variété de <strong>conditions de dépendance</strong> comme :
  <ul>
    <li><strong>All succeeded</strong> — dépendance traditionnelle : toutes les tâches amont doivent se terminer avec succès avant que la tâche suivante puisse s'exécuter.</li>
    <li><strong>At least one succeeded</strong> — utile quand on a des sources de données ou chemins de traitement <strong>redondants</strong> : le workflow peut avancer si ne serait-ce qu'une des tâches amont requises a réussi.</li>
    <li><strong>None failed</strong> — permet à une tâche de s'exécuter même si certaines tâches amont ont été <em>skippées</em>, tant qu'aucune n'a explicitement échoué.</li>
    <li><strong>And more</strong> — combinaisons personnalisées permettant d'implémenter une logique métier complexe nécessitant des combinaisons spécifiques de résultats de tâches.</li>
  </ul>
</li>
</ul>
<p><strong>Exemple — At Least One Succeeded :</strong></p>

</svg>
<p><strong>Bénéfices des dépendances conditionnelles :</strong> si <code>Task-4</code> est configurée pour s'exécuter quand « au moins une » de ses tâches précédentes (<code>Task-2</code> ou <code>Task-3</code>) réussit, elle peut quand même s'exécuter si <code>Task-3</code> échoue tandis que <code>Task-2</code> réussit. Cela <strong>évite les défaillances en cascade</strong> et permet aux workflows de continuer même quand certains composants échouent. Cela reflète aussi les processus métier réels où plusieurs chemins vers le succès existent et où des échecs partiels n'arrêtent pas toute l'opération.</p>
<ul>
<li>Les dépendances de tâches fournissent une <strong>logique de flux de contrôle basée sur le statut des tâches amont</strong>.</li>
<li>Elles sont <strong>représentées visuellement dans le DAG du job</strong> : différents styles et couleurs de lignes indiquent différents types de dépendances, rendant une logique complexe compréhensible d'un coup d'œil.</li>
</ul>
<p><strong>Comment configurer :</strong> on sélectionne ces conditions de dépendance dans les <strong>réglages de configuration de la tâche</strong>, sous la section « <em>run-if dependencies</em> ».</p>
<div class="callout"><strong>Flux d'exécution (3 étapes observées dans l'UI) :</strong><br/>
<strong>1. Job Initialization</strong> — le système évalue toutes les dépendances et détermine l'ensemble d'exécution initial ; toutes les tâches s'exécutent <em>concurremment</em>.<br/>
<strong>2. Waiting for all tasks to complete</strong> — à mesure que les tâches se terminent (avec succès ou échec), le système réévalue en continu quelles tâches aval peuvent s'exécuter. Exemple : <code>Ingest_Source_2</code> et <code>Ingest_Source_3</code> sont terminées et attendent que <code>Ingest_Source_1</code> se termine avant de passer à la tâche <code>All_Data_Ingested</code>.<br/>
<strong>3. Dependent Task Started</strong> — une fois les trois tâches complétées (All succeeded), la tâche finale démarre.</div>

<h4>2) If/Else — tâches conditionnelles</h4>

<ul>
<li>Ajoute une <strong>logique conditionnelle booléenne</strong> à votre workflow, basée sur les résultats des tâches.</li>

<li>Utilise les <strong>opérateurs booléens</strong> <code>==</code>, <code>!=</code>, <code>&gt;</code>, <code>&gt;=</code>, <code>&lt;</code>, <code>&lt;=</code> pour évaluer les expressions.</li>
</ul>
<p><strong>Exemples de logique métier :</strong></p>
<ul>
<li><strong>Data Quality Gates</strong> — brancher selon les comptages d'enregistrements, pourcentages de valeurs nulles ou résultats de validation.</li>
<li><strong>Processing Volume Decisions</strong> — utiliser des stratégies de traitement différentes pour de gros vs de petits jeux de données.</li>
<li><strong>Environment-Specific Logic</strong> — exécuter des tâches différentes selon les paramètres d'environnement.</li>
<li><strong>Business Rule Implementation</strong> — implémenter des règles métier complexes directement dans la logique du workflow.</li>
</ul>
<p><strong>Prérequis d'exécution :</strong> la condition « <em>If none of dependency failed and at least one task executed</em> » garantit que l'évaluation conditionnelle n'a lieu que lorsque des résultats amont significatifs sont disponibles. <strong>Branches True/False :</strong> chaque branche peut contenir plusieurs tâches, permettant des chemins de traitement complexes selon les résultats conditionnels.</p>

<h4>3) For Each — tâche itérative</h4>

</svg>
<ul>
<li><strong>For Each</strong> boucle sur un <strong>tableau d'entrée</strong> et exécute la <strong>même tâche imbriquée</strong> pour chaque élément, en le passant sous forme de <code>{{input}}</code>.</li>
<li>Les itérations peuvent s'exécuter <strong>en parallèle</strong>, avec une <strong>concurrence configurable</strong> pour accélérer l'exécution.</li>
<li>Les <strong>dépendances aval s'attachent au conteneur For Each</strong>, pas à la tâche imbriquée.</li>
</ul>
<p><strong>Le concept de conteneur :</strong> la tâche For Each agit comme une <strong>unité logique unique</strong> dans votre workflow, même si elle exécute plusieurs itérations en interne. Les tâches aval n'ont besoin de dépendre que du conteneur For Each, et non de chaque itération individuelle, ce qui garde les diagrammes de workflow propres et gérables. Le conteneur gère aussi l'<strong>allocation de ressources</strong> entre itérations, optimisant l'utilisation du cluster et prévenant les conflits de ressources.</p>
<p><strong>Deux composants à définir :</strong></p>
<ol>
<li><strong>The For Each task</strong> — la tâche conteneur de haut niveau qui gère la boucle : logique d'itération, traitement du tableau d'entrée, réglages de concurrence et allocation de ressources.</li>
<li><strong>A nested task</strong> — la tâche réelle qui s'exécute à chaque itération. Elle peut être de n'importe quel type (notebook, SQL, script Python, etc.) ; elle reçoit chaque élément du tableau sous forme de <code>{{input}}</code>.</li>
</ol>
<p>Cette séparation permet de configurer le comportement d'itération <strong>indépendamment</strong> de la logique de traitement, rendant les tâches For Each à la fois puissantes et maintenables.</p>
<p><strong>Exemples de cas d'usage :</strong></p>
<ul>
<li><strong>Geographic Processing</strong> — traiter les données de chaque état/région en parallèle.</li>
<li><strong>Time Period Processing</strong> — gérer différentes plages de dates avec la même logique.</li>
<li><strong>Customer Segment Processing</strong> — appliquer la même analyse à différents segments clients.</li>
<li><strong>File Processing</strong> — traiter plusieurs fichiers avec une logique identique.</li>
</ul>`

        html: `
<p>La gestion des échecs ne consiste pas seulement à relancer des tâches : il s'agit de construire des systèmes <strong>résilients</strong>, capables de récupérer efficacement et de maintenir la cohérence des données même quand des composants tombent.</p>
<h4>Re-run the failed task</h4>
<ul>
<li>La fonctionnalité <strong>Repair</strong> permet de <strong>ré-exécuter et de surcharger les paramètres de tâche</strong>.</li>
<li>Elle <strong>réduit le temps et les ressources</strong> nécessaires pour récupérer d'exécutions de job infructueuses.</li>
<li>En cas d'échec de tâche, vous pouvez :
  <ul>
    <li><strong>modifier la tâche</strong> et relancer ;</li>
    <li><strong>modifier les paramètres</strong> et relancer.</li>
  </ul>
</li>
</ul>
<p><strong>Récupération ciblée :</strong> au lieu de redémarrer des workflows entiers, vous pouvez modifier des tâches échouées spécifiques et ne relancer que ce qui est nécessaire. Cela économise un temps et des ressources de calcul significatifs.</p>
<p><strong>Scénarios de récupération :</strong></p>
<ul>
<li><strong>Configuration Fixes</strong> — corriger des valeurs de paramètres qui ont causé les échecs.</li>
<li><strong>Resource Adjustments</strong> — augmenter la mémoire ou les ressources de compute pour les tâches ayant échoué par contrainte de ressources.</li>
<li><strong>Code Updates</strong> — déployer des correctifs d'erreurs de logique et ne relancer que les tâches concernées.</li>
<li><strong>Data Quality Issues</strong> — ajuster la logique de traitement pour gérer des problèmes de qualité découverts pendant l'exécution.</li>
</ul>

<h4>Ne relancer que les tâches nécessaires</h4>
<p>La fonctionnalité permet de n'exécuter que les tâches échouées, ce qui vous <strong>fait gagner du temps et de l'argent</strong> en ne relançant que le nécessaire plutôt que le job entier.</p>
<ul>
<li><strong>Resource Optimization</strong> — n'exécuter que les tâches échouées au lieu de workflows entiers peut réduire le temps de récupération de <strong>80–90 %</strong> dans des pipelines complexes.</li>
<li><strong>Reduced Risk</strong> — des opérations de récupération plus petites ont moins d'impact sur les ressources système et réduisent le risque de défaillances en cascade pendant la récupération.</li>
<li><strong>Faster Resolution</strong> — les équipes peuvent réagir plus vite aux échecs sans attendre la fin de workflows entiers, améliorant le respect des SLA et la réactivité métier.</li>
</ul>
<div class="callout"><strong>Point d'attention important :</strong> réparer une tâche ne veut pas dire réparer le job. Par exemple, si vous passez un mauvais paramètre et le corrigez via la fonctionnalité <em>repair run</em>, vous devez <strong>toujours modifier ce paramètre dans la définition de votre job</strong>.</div>

<h4>Après la réparation</h4>
<p>Après les opérations de réparation, l'historique des runs du job montre clairement le processus de récupération :</p>
<ul>
<li><strong>Audit Trail</strong> — visibilité complète sur ce qui a été réparé, quand et par qui : une information essentielle pour le dépannage et l'amélioration des processus.</li>
<li><strong>Success Validation</strong> — indication claire des tâches récupérées avec succès, permettant d'avoir confiance dans le processus de réparation.</li>
<li><strong>Learning Opportunities</strong> — les données historiques de réparation aident les équipes à identifier des patterns d'échec et à améliorer la conception initiale des jobs pour prévenir les problèmes futurs.</li>
</ul>`

<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px">
<div style="background:#1c232d;border:1px solid #2b3542;border-left:3px solid #ff4a2e;border-radius:9px;padding:13px">
<div style="font-family:'Space Grotesk',sans-serif;font-size:12.5px;font-weight:600;color:#ff6a52;margin-bottom:6px">Interactive Clusters</div>
<p style="font-size:13px;margin:0 0 8px">Le mieux pour l'analyse ad-hoc, l'exploration de données ou le développement — <strong>mais pas la production</strong> :</p>
<ul style="font-size:13px;margin:0;padding-left:18px">
<li><strong>Costly for Job runs</strong> — les clusters interactifs restent actifs même quand ils n'exécutent pas de job, générant des coûts inutiles.</li>
<li><strong>Limited Scalability</strong> — les ressources partagées peuvent créer de la contention et une performance imprévisible.</li>
<li><strong>Availability could be an issue</strong> à cause de l'usage parallèle — plusieurs utilisateurs partageant les clusters peuvent causer des conflits de ressources et des retards.</li>

<div style="background:#1c232d;border:1px solid #2b3542;border-left:3px solid #e3b23c;border-radius:9px;padding:13px">

<p style="font-size:13px;margin:0 0 8px">Moins chers car ils se terminent à la fin du job, réduisant l'usage des ressources et les coûts. Mais :</p>
<ul style="font-size:13px;margin:0;padding-left:18px">

<li><strong>Maintenance Burden</strong> — davantage de configuration et de gestion que les options serverless.</li>

</ul>

<h4>Selecting Compute — Serverless Compute</h4>
<table class="tbl">
<thead><tr><th style="width:22%">Atout</th><th>Détail</th></tr></thead>

<tr><td><strong>Reliability</strong></td><td>Protégé (<em>shielded</em>) des perturbations du cloud.</td></tr>
</tbody>

<p><strong>Stratégie de décomposition :</strong> décomposer les DAG complexes en <strong>unités métier logiques</strong> plutôt qu'en composants techniques. Chaque module doit représenter une fonction métier cohésive qui peut être développée, testée et déployée indépendamment.</p>
<p><strong>Relations parent-enfant :</strong> les <strong>Parent Jobs</strong> orchestrent des <strong>Child Jobs</strong>, créant une séparation nette des responsabilités tout en maintenant la coordination globale du workflow.</p>
<ul>
<li><strong>Maintainability</strong> — les jobs plus petits sont plus faciles à comprendre, modifier et dépanner.</li>
<li><strong>Reusability</strong> — les child jobs peuvent être réutilisés dans plusieurs workflows parents.</li>
<li><strong>Team Collaboration</strong> — différentes équipes peuvent posséder différents modules tout en collaborant sur le workflow global.</li>
<li><strong>Testing</strong> — les modules individuels peuvent être testés indépendamment, améliorant la qualité et réduisant le risque de déploiement.</li>
</ul>

<h4>Jobs and Git</h4>
<p>Jobs supporte l'<strong>exécution de notebooks depuis Git</strong> :</p>
<ul>
<li>Cela <strong>évite les modifications involontaires de votre job de production</strong> — par exemple, quand un autre utilisateur fait des éditions locales dans un repo « Prod » ou change de branche.</li>
<li>Cela <strong>simplifie le processus de définition du job</strong> en ayant une <strong>source unique de vérité</strong>.</li>
<li>Cela <strong>facilite le déploiement</strong> des notebooks via <strong>CI/CD</strong>.</li>
<li>Les utilisateurs peuvent se connecter à diverses plateformes Git : Databricks supporte <strong>GitHub, GitLab, AWS CodeCommit</strong> et d'autres fournisseurs Git.</li>
</ul>
<div class="demo"><span class="demo-label">Jobs and Git — étapes de configuration</span>

<p><strong>2 — Configure path to main notebook under repository root :</strong> configurez le chemin vers votre notebook principal sous la racine du dépôt, afin que le job puisse localiser et exécuter le bon point d'entrée de votre workflow.</p>

<li><strong>Parameterization</strong> — concevez les tâches avec un <strong>paramétrage</strong> approprié pour une réutilisabilité et une flexibilité maximales entre environnements et cas d'usage.</li>

        id: "w3l2", title: "Qu'est-ce que SDP ?",
        html: `
<h4>Pourquoi c'est difficile</h4>
<p>Construire et opérer des pipelines de données fiables demande de gérer une multitude de préoccupations en plus de la logique de transformation : <strong>gestion des dépendances, calcul des partitions, checkpointing & retries, gestion des backfills, contrôles qualité, gouvernance, découverte des données, version control, déploiement, infrastructure…</strong></p>
<p>Conséquences typiques :</p>
<ul>
<li><strong>Développement laborieux</strong> et pipelines lents/sources d'erreurs → retarde les produits data et l'impact métier.</li>
<li><strong>Complexité opérationnelle</strong> → coûts élevés, downtime, gaspillage de ressources.</li>
<li><strong>Batch et streaming en silos</strong> → flexibilité limitée, difficile et coûteux de s'adapter aux besoins de latence/coût/SLA.</li>
</ul>
<h4>Ce qu'apporte SDP — « Reliable data pipelines made easy »</h4>
<ul>
<li><strong>Batch et streaming unifiés :</strong> les pipelines s'adaptent au quasi temps réel comme au batch, optimisant performance et coût.</li>
<li><strong>Optimisation intelligente à l'échelle :</strong> scaling et récupération automatiques → fiabilité accrue, maintenance réduite.</li>
<li><strong>Authoring simplifié :</strong> on déclare ingestion et transformations en SQL ou Python, et SDP gère le reste.</li>
</ul>
<h4>SDP dans le Médaillon & traitement incrémental</h4>
<p>SDP simplifie l'ETL batch et streaming dans l'architecture Médaillon. Les sources (Lakeflow Connect, SaaS, stockage cloud, files d'attente comme Kafka/Pub-Sub/Kinesis, bases de données) alimentent Bronze → Silver → Gold.</p>
<p><strong>Vue d'ensemble du traitement incrémental :</strong> source brute → Bronze (<em>streaming table</em>) → Silver (<em>streaming table</em>) → Gold (<em>materialized view</em>).</p>
<ul>
<li><strong>Run 1 :</strong> le fichier 1 est ingéré (append) en Bronze, transformé (append) en Silver, puis agrégé en Gold (materialized view), avec des optimisations natives sur serverless.</li>
<li><strong>Run 2 :</strong> seules les <strong>nouvelles données</strong> (fichier 2) sont appendées et transformées ; le batch traite en mode <em>append</em> (planifié), le streaming en flux continu.</li>

        id: "w3l3", title: "Types de datasets : ST, MV, Views",
        html: `
<p>SDP manipule trois types de datasets selon la façon de traiter les données.</p>
<h4>STREAMING TABLE (ST)</h4>
<ul>
<li>Table supportant le traitement <strong>incrémental ou streaming</strong> (<strong>exactly-once</strong> : chaque fichier lu une seule fois).</li>
<li>À chaque rafraîchissement, les données ajoutées aux tables sources sont <strong>appendées</strong> à la streaming table.</li>
<li>Code SQL : <code>CREATE OR REFRESH STREAMING TABLE</code>.</li>
<li>En SQL, utiliser <code>FROM STREAM read_files()</code> pour invoquer Auto Loader (lectures streaming incrémentales + checkpoints).</li>
</ul>
<h4>MATERIALIZED VIEW (MV)</h4>
<ul>
<li>À chaque mise à jour, les résultats de la requête sont <strong>recalculés</strong> pour refléter les changements des datasets amont.</li>
<li>Créée et tenue à jour par le pipeline ; syntaxe <code>CREATE OR REFRESH MATERIALIZED VIEW</code>.</li>
<li>Utilisable <strong>partout</strong> dans le pipeline (pas seulement en Gold).</li>
<li>Quand c'est possible, les résultats sont <strong>rafraîchis de façon incrémentale</strong> (évite la reconstruction complète à l'arrivée de nouvelles données) — <strong>Serverless uniquement</strong>, via un optimiseur basé sur les coûts.</li>
<li>Sert aux transformations, agrégations, pré-calcul de requêtes lentes, calculs fréquents.</li>
</ul>
<h4>VIEW & TEMPORARY VIEW</h4>
<ul>
<li>Construisent une <strong>table virtuelle sans données physiques</strong>, basée sur la requête.</li>
<li><strong>TEMPORARY VIEW :</strong> persiste seulement sur la durée de vie du pipeline, privée au pipeline, <strong>non enregistrée dans Unity Catalog</strong> ; utile comme requête intermédiaire non exposée aux utilisateurs finaux. Syntaxe <code>CREATE TEMPORARY VIEW</code>.</li>
<li><strong>VIEW :</strong> <strong>enregistrée comme objet dans Unity Catalog</strong> ; syntaxe <code>CREATE VIEW</code>. <em>Limitations :</em> le pipeline doit être un pipeline UC ; les views ne peuvent pas avoir de requêtes streaming ni servir de source streaming.</li>
</ul>
<div class="callout"><strong>Renommages depuis DLT</strong> (l'ancienne syntaxe reste supportée par compatibilité) :<br/>
<code>CREATE OR REFRESH STREAMING LIVE TABLE</code> → <code>CREATE OR REFRESH STREAMING TABLE</code><br/>
<code>CREATE OR REFRESH LIVE TABLE</code> → <code>CREATE OR REFRESH MATERIALIZED VIEW</code><br/>
<code>CREATE LIVE VIEW</code> / <code>CREATE TEMPORARY LIVE VIEW</code> → <code>CREATE VIEW</code> / <code>CREATE TEMPORARY VIEW</code></div>`

<h4>Streaming table Bronze (depuis des fichiers JSON)</h4>
<pre><code>CREATE OR REFRESH STREAMING TABLE 1_bronze_db.orders_bronze AS
SELECT *,
       current_timestamp() AS processing_time,
       _metadata.file_name AS source_file
FROM STREAM read_files(
  "/Volumes/dbacademy/ops/labuser/orders",
  format =&gt; 'JSON');</code></pre>
<ul>
<li>Le mot-clé <strong><code>STREAM</code></strong> indique d'utiliser une lecture streaming des fichiers source.</li>
<li><code>read_files()</code> lit les fichiers d'un emplacement et renvoie des données tabulaires.</li>
<li>Le <code>SELECT</code> choisit les colonnes à lire ; ici on ajoute aussi <code>processing_time</code> et <code>source_file</code>.</li>
<li>Crée la streaming table <code>orders_bronze</code> dans le schéma <code>1_bronze_db</code> (catalogue par défaut).</li>
</ul>
<h4>Streaming table Silver (transformation depuis Bronze)</h4>
<pre><code>CREATE OR REFRESH STREAMING TABLE 2_silver_db.orders_silver AS
SELECT order_id,
       timestamp(order_timestamp) AS order_timestamp,
       customer_id,
       notifications
FROM STREAM 1_bronze_db.orders_bronze;</code></pre>

<p>Avec SDP, on applique des <strong>règles de qualité</strong> pour valider les lignes pendant l'ETL et obtenir des insights sur l'intégrité des données. Syntaxe générale :</p>
<pre><code>CONSTRAINT &lt;constraint-name&gt; EXPECT (&lt;column condition&gt;) [ON VIOLATION &lt;action&gt;]</code></pre>
<table class="tbl">
<thead><tr><th>Action</th><th>Exemple</th><th>Résultat</th></tr></thead>
<tbody>
<tr><td><strong>WARN</strong> (défaut)</td><td><code>CONSTRAINT valid_notification EXPECT (notifications IN ('Y','N'))</code></td><td>Les lignes invalides sont <strong>quand même écrites</strong> dans la cible ; les logs incluent le compte de valides vs invalides et d'autres métriques.</td></tr>
<tr><td><strong>DROP</strong></td><td><code>CONSTRAINT valid_date EXPECT (order_timestamp &gt; "2021-01-01") ON VIOLATION DROP ROW</code></td><td>Les lignes invalides sont <strong>supprimées</strong> de la table ; le compte est journalisé avec les autres métriques.</td></tr>
<tr><td><strong>FAIL</strong></td><td><code>CONSTRAINT valid_id EXPECT (customer_id IS NOT NULL) ON VIOLATION FAIL UPDATE</code></td><td>Provoque l'<strong>échec du flow</strong> concerné (sans faire échouer les autres flows du pipeline) ; <strong>intervention manuelle</strong> requise.</td></tr>
</tbody>
</table>
<h4>Exemple combiné</h4>
<pre><code>CREATE OR REFRESH STREAMING TABLE 2_silver_db.orders_silver (
  CONSTRAINT valid_notifications EXPECT (notifications IN ('Y','N')),
  CONSTRAINT valid_id            EXPECT (customer_id IS NOT NULL) ON VIOLATION DROP ROW,
  CONSTRAINT valid_date          EXPECT (order_timestamp &gt; "2021-01-01") ON VIOLATION FAIL UPDATE
) AS
SELECT order_id,
       timestamp(order_timestamp) AS order_timestamp,
       customer_id,
       notifications
FROM STREAM 1_bronze_db.orders_bronze;</code></pre>
<p>Pour chaque ligne, l'expectation décide : <strong>Pass</strong> → garder la ligne et continuer ; <strong>WARN</strong> → consigner en métrique ; <strong>DROP</strong> → écarter la ligne ; <strong>FAIL</strong> → faire échouer le flow.</p>
<div class="callout">Depuis le Q2 2025, les <strong>materialized views</strong> qui utilisent des expectations sont <strong>toujours entièrement rafraîchies</strong>.</div><div class="demo"><span class="demo-label">Exemple — Expectations (3 niveaux d'action)</span><p>Les contraintes <code>EXPECT</code> définissent la politique sur violation : <strong>warn</strong> (par défaut, on garde la ligne), <strong>DROP ROW</strong> (on rejette la ligne), <strong>FAIL UPDATE</strong> (on échoue le flow) :</p><pre><code>CREATE STREAMING TABLE 1_bronze_db.customers_bronze_clean_demo6
(
  CONSTRAINT valid_id        EXPECT (customer_id IS NOT NULL) ON VIOLATION FAIL UPDATE,
  CONSTRAINT valid_operation EXPECT (operation  IS NOT NULL) ON VIOLATION DROP ROW,
  CONSTRAINT valid_name      EXPECT (name IS NOT NULL OR operation = "DELETE"),   -- warn seulement
  CONSTRAINT valid_address   EXPECT (
    (address IS NOT NULL AND city IS NOT NULL AND state IS NOT NULL AND zip_code IS NOT NULL)
    OR operation = "DELETE")
)
COMMENT "Clean raw bronze + data quality constraints"
AS
SELECT *, CAST(from_unixtime(timestamp) AS timestamp) AS timestamp_datetime
FROM STREAM 1_bronze_db.customers_bronze_raw_demo6;</code></pre></div>`

        html: `
<p>Trois schémas de jointure dans les pipelines.</p>
<h4>1) Stream-Snapshot (ST ↔ table statique)</h4>
<ul>
<li>Objectif : joindre de façon <strong>incrémentale</strong> les <em>nouvelles</em> données d'une streaming table avec l'<strong>intégralité</strong> d'une table de référence (lookup) statique.</li>
<li>Seules les nouvelles données du flux sont jointes, en utilisant toutes les données de la table de lookup. Résultat : une streaming table jointe (append).</li>
</ul>
<h4>2) ST + ST via Materialized View</h4>
<ul>
<li>Objectif : prendre <strong>toutes les lignes de deux streaming tables</strong> et les joindre à chaque exécution du pipeline.</li>
<li>La <strong>materialized view</strong> calcule efficacement toutes les données des streaming tables et joint les lignes ; à l'arrivée de nouvelles données, elle recalcule efficacement la jointure.</li>
</ul>
<h4>3) Stream-Stream</h4>
<ul>
<li>Objectif : joindre de façon <strong>incrémentale</strong> les nouvelles données de <strong>deux flux</strong> ; les données passées ne sont pas utilisées.</li>
<li><em>Hors périmètre du cours</em> (voir le cours « Databricks Streaming and DLT (Advanced) »).</li>
</ul><div class="demo"><span class="demo-label">Exemple — joindre deux ST via une Materialized View</span><p>Une façon de joindre deux streaming tables : une <strong>materialized view</strong> qui exécute un inner join complet. Noter que <strong>le mot-clé <code>STREAM</code> n'est pas utilisé</strong> quand on référence les ST dans la MV :</p><pre><code>CREATE OR REFRESH MATERIALIZED VIEW 3_gold_db.full_order_info_gold_demo5
  COMMENT "Join orders + order status (tous les statuts par commande)"
  TBLPROPERTIES ("quality" = "gold")
AS
SELECT
  orders.order_id, orders.order_timestamp,
  status.order_status, status.order_status_timestamp
FROM 2_silver_db.status_silver_demo5 status
INNER JOIN 2_silver_db.orders_silver_demo5 orders
  ON orders.order_id = status.order_id;</code></pre><p>Puis des MV Gold dérivées, p.ex. les commandes annulées avec délai calculé via <code>datediff()</code> :</p><pre><code>CREATE OR REFRESH MATERIALIZED VIEW 3_gold_db.cancelled_orders_gold_demo5
  TBLPROPERTIES ("quality" = "gold")
AS
SELECT order_id, order_timestamp, order_status, order_status_timestamp,
  datediff(DAY, order_timestamp, order_status_timestamp) AS days_to_cancel
FROM 3_gold_db.full_order_info_gold_demo5
WHERE order_status = 'canceled';</code></pre></div>`

        html: `
<p>Trois tâches de production courantes : <strong>planifier</strong> le pipeline, configurer les <strong>notifications email</strong>, <strong>monitorer</strong> via l'event log.</p>
<h4>Scheduling — modes de déclenchement</h4>
<ul>
<li><strong>Triggered :</strong> rafraîchit les tables sélectionnées avec les données disponibles au démarrage, puis <strong>s'arrête</strong> une fois la mise à jour terminée. Déclenchable manuellement ou planifié.</li>
<li><strong>Continuous :</strong> traite en <strong>continu</strong> les nouvelles données pour maintenir streaming tables et materialized views quasi à jour en temps réel ; surveille les dépendances et ne met à jour que quand la source change.</li>
</ul>
<h4>Email Notifications</h4>
<p>On peut configurer des notifications email lors de la planification du pipeline.</p>
<h4>Monitoring — Event Log</h4>
<p>L'<strong>event log</strong> du pipeline capture toutes les informations clés :</p>
<ul>
<li><strong>Logs d'audit</strong></li>
<li><strong>Contrôles de qualité</strong> (data quality checks)</li>
<li><strong>Progression du pipeline</strong></li>
<li><strong>Data lineage</strong></li>
</ul>
<p>Par <strong>défaut</strong>, l'event log est écrit comme <strong>table Delta cachée</strong>, située dans le catalogue/schéma par défaut du pipeline. Via les paramètres avancés, on peut le <strong>publier</strong> comme table Delta (spécifier catalogue, schéma, nom de table), puis l'interroger :</p>
<pre><code>SELECT * FROM &lt;catalog&gt;.&lt;schema&gt;.&lt;event_log_table_name&gt;;</code></pre><div class="demo"><span class="demo-label">Exemple — analyser la qualité via l'event log</span><p>L'event log expose les résultats des expectations. On explose le JSON <code>flow_progress</code> pour compter lignes passées/échouées par dataset et par contrainte :</p><pre><code>CREATE OR REPLACE TEMPORARY VIEW dq_source_vw AS
SELECT explode(
    from_json(details:flow_progress:data_quality:expectations,
      "array&lt;struct&lt;name: string, dataset: string, passed_records: int, failed_records: int&gt;&gt;")
  ) AS row_expectations
FROM default.event_log_demo_5
WHERE event_type = 'flow_progress';

SELECT
  row_expectations.dataset AS dataset,
  row_expectations.name    AS expectation,
  SUM(row_expectations.passed_records) AS passing_records,
  SUM(row_expectations.failed_records) AS warnings_records
FROM dq_source_vw
GROUP BY row_expectations.dataset, row_expectations.name
ORDER BY dataset;</code></pre></div>`

        id: "w3l9", title: "Change Data Capture (CDC) & SCD",
        html: `
<h4>Qu'est-ce que le CDC ?</h4>
<p>Le <strong>Change Data Capture (CDC)</strong> est une technique pour <strong>suivre et capturer les changements</strong> dans une source (base de données, lakehouse, data warehouse) — <strong>INSERTS, UPDATES, DELETES</strong> — puis appliquer ces changements dans le lakehouse/data warehouse. La table source des changements doit actuellement être une <strong>streaming table</strong> ; la table cible reçoit les changements appliqués.</p>
<p>Le CDC se catégorise en types de <strong>Slowly Changing Dimensions (SCD)</strong> selon la gestion de l'historique.</p>
<h4>SCD Type 1 (écrasement)</h4>
<ul>
<li>Quand un enregistrement est mis à jour, l'ancien est <strong>simplement écrasé</strong> par sa clé avec la nouvelle valeur.</li>
<li>Quand un enregistrement est supprimé par sa clé, la ligne est <strong>retirée</strong>.</li>
<li><strong>Aucun suivi des anciennes valeurs</strong> : seule la donnée courante est conservée.</li>
<li>À utiliser quand seul l'<strong>état actuel</strong> compte et que l'historique est sans importance.</li>
</ul>
<p>Exemple : sur la table <code>customers</code>, en appliquant les <code>updates</code> — Peter est mis à jour avec sa dernière info, Samarth est supprimé, Kostas est inséré.</p>
<h4>SCD Type 2 (historisation / versioning)</h4>
<ul>
<li>Quand un enregistrement change, l'ancien est <strong>conservé</strong> avec une colonne indiquant sa <strong>période de validité</strong> (date de début, date de fin, ou flag courant), et un <strong>nouvel</strong> enregistrement est inséré avec l'info à jour.</li>
<li>Une suppression conserve la ligne et la marque inactive.</li>
<li>À utiliser quand l'<strong>historique est important</strong> (ex. suivre l'évolution de l'adresse ou du statut d'un client).</li>
<li>Colonnes typiques <code>__START_AT</code> / <code>__END_AT</code> : un <code>__END_AT</code> à <code>null</code> indique la ligne <strong>courante</strong>, une valeur non nulle indique une ligne <strong>historique (inactive)</strong>.</li>
<li><em>Hors périmètre détaillé du cours.</em></li>
</ul>
<h4>AUTO CDC INTO (anciennement APPLY CHANGES INTO)</h4>
<p>À utiliser au lieu d'un batch traditionnel avec une syntaxe <code>MERGE INTO</code> complexe. Les INSERT et UPDATE sont implémentés <strong>implicitement via les clés</strong>, sans code.</p>
<pre><code>CREATE OR REFRESH STREAMING TABLE customers;

CREATE FLOW scd_type_1_flow AS
AUTO CDC INTO customers
FROM STREAM updates
KEYS (CustomerID)
APPLY AS DELETE WHEN operation = "DELETE"
SEQUENCE BY ProcessDate
COLUMNS * EXCEPT (operation)
STORED AS SCD TYPE 1;</code></pre>
<ul>
<li>On crée d'abord une streaming table, puis on utilise <code>AUTO CDC</code> pour la peupler.</li>
<li><code>FROM STREAM updates</code> : les enregistrements source qui déterminent updates/deletes/inserts.</li>
<li><code>KEYS (CustomerID)</code> : la/les colonne(s) qui identifient une ligne dans source et cible.</li>
<li><code>APPLY AS DELETE WHEN</code> : quand un événement CDC doit être traité comme un <strong>DELETE</strong> plutôt qu'un upsert.</li>
<li><code>SEQUENCE BY ProcessDate</code> : l'<strong>ordre logique</strong> des événements CDC dans la source.</li>
<li><code>COLUMNS * EXCEPT (operation)</code> : sous-ensemble de colonnes à inclure dans la cible.</li>
<li><code>STORED AS SCD TYPE 1</code> (défaut) ou <code>TYPE 2</code>.</li>
</ul>
<div class="callout"><strong>AUTO CDC FROM SNAPSHOT</strong> (Public Preview au Q2 2025) traite les changements à partir de <em>snapshots</em> de base de données.</div><div class="demo"><span class="demo-label">Exemple — AUTO CDC INTO (SCD Type 1)</span><p>On crée la table cible, puis un <strong>flow</strong> <code>AUTO CDC INTO</code> qui applique les changements (updates/deletes/inserts) en ordonnant par une colonne de séquence :</p><pre><code>-- Table cible
CREATE OR REFRESH STREAMING TABLE 2_silver_db.scd_type_1_customers_silver_demo6
  COMMENT 'SCD Type 1 Historical Customer Data';

-- Flow CDC
CREATE FLOW scd_type_1_flow AS
AUTO CDC INTO 2_silver_db.scd_type_1_customers_silver_demo6   -- table cible
FROM STREAM 1_bronze_db.customers_bronze_clean_demo6          -- source des changements
  KEYS (customer_id)                              -- clé primaire d'identification
  APPLY AS DELETE WHEN operation = "DELETE"       -- gestion des suppressions
  SEQUENCE BY timestamp_datetime                  -- ordre d'application des changements
  COLUMNS * EXCEPT (timestamp, _rescued_data, operation)
  STORED AS SCD TYPE 1;                           -- SCD Type 1 (pas d'historique)</code></pre><p class="demo-note">Passer <code>STORED AS SCD TYPE 2</code> pour conserver l'historique des versions. La cible doit exister avant le <code>CREATE FLOW</code>.</p></div><h4>Pipeline complet — CDC clients (synthèse)</h4><p>Ce pipeline de bout en bout réunit la plupart des notions vues jusqu’ici : ingestion incrémentale par <strong>Auto Loader</strong>, <strong>colonnes de métadonnées</strong>, <strong>expectations</strong> de qualité, et application des changements via <strong>AUTO CDC INTO</strong> en <strong>SCD Type 1</strong>.</p><div class="demo"><span class="demo-label">STEP 1 — JSON → Bronze (ingestion Auto Loader)</span><p>Ingestion incrémentale des fichiers JSON du flux CDC vers une streaming table, en capturant l’horodatage de traitement et le fichier source :</p><pre><code>CREATE OR REFRESH STREAMING TABLE 1_bronze_db.customers_bronze_raw_demo6
  COMMENT "Raw data from customers CDC feed"
  TBLPROPERTIES (
    "quality" = "bronze",
    "pipelines.reset.allowed" = false   -- empêche un full refresh du bronze
  )
AS
SELECT
  *,
  current_timestamp()  AS processing_time,  -- horodatage d'ingestion des lignes
  _metadata.file_name  AS source_file       -- nom du fichier source
FROM STREAM read_files(
  "$\{source}/customers",
  format =&gt; "json"
);</code></pre></div><div class="demo"><span class="demo-label">STEP 2 — Bronze clean (enforcement qualité)</span><p>Table bronze nettoyée avec contraintes <code>EXPECT</code> : id non nul (<code>FAIL UPDATE</code>), opération non nulle et email valide (<code>DROP ROW</code>), nom/adresse en warn — sauf pour les suppressions :</p><pre><code>CREATE STREAMING TABLE 1_bronze_db.customers_bronze_clean_demo6
(
  CONSTRAINT valid_id        EXPECT (customer_id IS NOT NULL) ON VIOLATION FAIL UPDATE,
  CONSTRAINT valid_operation EXPECT (operation  IS NOT NULL) ON VIOLATION DROP ROW,
  CONSTRAINT valid_name      EXPECT (name IS NOT NULL OR operation = "DELETE"),
  CONSTRAINT valid_address   EXPECT (
    (address IS NOT NULL AND city IS NOT NULL AND
     state IS NOT NULL AND zip_code IS NOT NULL)
    OR operation = "DELETE"),
  CONSTRAINT valid_email     EXPECT (
    rlike(email, '^([a-zA-Z0-9_\\-\\.]+)@([a-zA-Z0-9_\\-\\.]+)\\.([a-zA-Z]{2,5})$')
    OR operation = "DELETE") ON VIOLATION DROP ROW
)
COMMENT "Clean raw bronze timestamp column and add data quality constraints"
AS
SELECT
  *,
  CAST(from_unixtime(timestamp) AS timestamp) AS timestamp_datetime
FROM STREAM 1_bronze_db.customers_bronze_raw_demo6;</code></pre></div><div class="demo"><span class="demo-label">STEP 3 — Bronze clean → Silver (AUTO CDC INTO, SCD Type 1)</span><p>On crée la table cible, puis un <code>CREATE FLOW</code> avec <code>AUTO CDC INTO</code> qui applique updates / deletes / inserts en ordonnant par <code>timestamp_datetime</code> :</p><pre><code>-- Créer la table cible si elle n'existe pas
CREATE OR REFRESH STREAMING TABLE 2_silver_db.scd_type_1_customers_silver_demo6
  COMMENT 'SCD Type 1 Historical Customer Data';

-- Appliquer le SCD Type 1
CREATE FLOW scd_type_1_flow AS
AUTO CDC INTO 2_silver_db.scd_type_1_customers_silver_demo6  -- table cible (SCD Type 1 ou 2)
FROM STREAM 1_bronze_db.customers_bronze_clean_demo6         -- source des changements
  KEYS (customer_id)                              -- clé primaire d'identification
  APPLY AS DELETE WHEN operation = "DELETE"       -- gestion des suppressions source -&gt; cible
  SEQUENCE BY timestamp_datetime                  -- ordre d'application des changements
  COLUMNS * EXCEPT (timestamp, _rescued_data, operation)   -- exclut les champs techniques
  STORED AS SCD TYPE 1;                           -- SCD Type 1 (pas d'historique)</code></pre><p class="demo-note">Remplacer par <code>STORED AS SCD TYPE 2</code> pour conserver l’historique des versions. La table cible doit exister <em>avant</em> le <code>CREATE FLOW</code>.</p></div>`

<p>Pour construire des pipelines fiables, on s'inspire du génie logiciel : suivre les bonnes pratiques garantit des pipelines <strong>efficaces, scalables et maintenables</strong>.</p>
<h4>Pratiques de codage</h4>

<thead><tr><th>Pratique</th><th>Détail</th></tr></thead>

<tr><td><strong>Code Readability</strong></td><td>Écrire du code facile à comprendre, naviguer et maintenir.</td></tr>

</tbody>

        id: "w4l3", title: "Modulariser le code PySpark",
        html: `
<h4>Avant (non modularisé)</h4>
<pre><code># Load data
df = (spark.read.csv("health.csv", header=True, inferSchema=True))

# Create column
df = df.withColumn("NewColumn",
        when(col("Column") == 0, 'Normal').otherwise('Unknown'))</code></pre>
<p><strong>Problèmes :</strong> tout est dans un seul bloc → plus difficile de modifier ou tester des parties spécifiques (chargement, ajout de colonne) ; <strong>duplication de code</strong> probable si les mêmes opérations sont nécessaires ailleurs.</p>
<h4>Après (modularisé en fonctions)</h4>
<pre><code>def load_data(file_path):
    return (spark.read.csv(file_path, header=True, inferSchema=True))

def add_new_col(df, new, s_col):
    return df.withColumn(new,
             when(col(s_col) == 0, 'Normal').otherwise('Unknown'))</code></pre>
<p><strong>Bénéfices :</strong></p>
<ul>

  <script>
/* ============================================================
   Databricks DEA Trainer — logique applicative
   ============================================================ */
(function () {
  "use strict";

  const $ = (s, r = document) => r.querySelector(s);
  const el = (tag, cls, html) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  };

  const state = {
    mode: "course",          // "course" | "full" | "exam"
    activeSection: COURSE[0].id,
    activeModule: MODULES[0].id,
    exam: null               // active exam session
  };

  const sidebar = $("#sidebar");
  const navArea = $("#nav-area");
  const content = $("#content");
  const tbTitle = $("#tb-title");

  /* ---------------- Sidebar ---------------- */
  function renderSidebar() {
    $("#mode-course").classList.toggle("active", state.mode === "course");
    $("#mode-full").classList.toggle("active", state.mode === "full");
    $("#mode-exam").classList.toggle("active", state.mode === "exam");
    navArea.innerHTML = "";

    if (state.mode === "course") {
      navArea.appendChild(el("div", "nav-label", "Résumé — 7 sections d'examen"));
      COURSE.forEach((sec) => {
        const b = el("button", "nav-item" + (sec.id === state.activeSection ? " active" : ""));
        b.innerHTML =
          `<span class="nav-num">${sec.num}</span>` +
          `<span class="tier-dot tier-${sec.tier}"></span>` +
          `<span>${sec.title}</span>` +
          `<span class="nav-w">${sec.weight}%</span>`;
        b.onclick = () => { goToSection(sec.id); closeMobile(); };
        navArea.appendChild(b);
      });
    } else if (state.mode === "full") {
      navArea.appendChild(el("div", "nav-label", "Cours complet — vos 4 modules"));
      MODULES.forEach((mod) => {
        const b = el("button", "nav-item" + (mod.id === state.activeModule ? " active" : ""));
        b.innerHTML =
          `<span class="nav-num">${mod.num}</span>` +
          `<span class="tier-dot tier-${mod.tier}"></span>` +
          `<span>${mod.title}</span>`;
        b.onclick = () => { goToModule(mod.id); closeMobile(); };
        navArea.appendChild(b);
      });
      navArea.appendChild(el("div", "sidebar-foot",
        "Reprise fidèle et exhaustive de vos 4 supports (W1→W4)."));
    } else {
      navArea.appendChild(el("div", "nav-label", "Entraînement"));
      const a = el("button", "nav-item active",
        `<span class="nav-num">EX</span><span>Examen blanc</span>`);
      a.onclick = () => { startExamSetup(); closeMobile(); };
      navArea.appendChild(a);
      navArea.appendChild(el("div", "sidebar-foot",
        "L'examen réel compte 45 questions notées, 90 minutes, score de réussite indicatif ≈ 70%."));
    }
  }

  /* ---------------- Mode switch ---------------- */
  function setMode(m) {
    state.mode = m;
    renderSidebar();
    if (m === "course") renderSection(state.activeSection);
    else if (m === "full") renderModule(state.activeModule);
    else startExamSetup();
  }

  /* ---------------- Course rendering ---------------- */
  function goToSection(id) {
    state.activeSection = id;
    renderSidebar();
    renderSection(id);
    content.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function goToModule(id) {
    state.activeModule = id;
    renderSidebar();
    renderModule(id);
    content.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  /* ---------------- Coloration syntaxique (SQL / Python) ---------------- */
  const HL_KW = new Set([
    "SELECT","FROM","WHERE","AS","CREATE","OR","REFRESH","REPLACE","TABLE","STREAMING",
    "MATERIALIZED","VIEW","TEMPORARY","DROP","IF","EXISTS","INTO","USING","ON","WHEN",
    "MATCHED","NOT","THEN","UPDATE","SET","DELETE","INSERT","VALUES","MERGE","WITH",
    "SCHEMA","EVOLUTION","AND","COPY","FILEFORMAT","FORMAT_OPTIONS","COPY_OPTIONS",
    "COMMENT","TBLPROPERTIES","CONSTRAINT","EXPECT","VIOLATION","ROW","FAIL","GROUP",
    "BY","ORDER","DESC","ASC","INNER","JOIN","LEFT","RIGHT","OUTER","FULL","LIMIT",
    "EXCEPT","DISTINCT","IS","NULL","IN","LIKE","CAST","FLOW","AUTO","CDC","KEYS",
    "APPLY","SEQUENCE","COLUMNS","STORED","SCD","SCHEDULE","EVERY","WEEK","HOUR","DAY",
    "STREAM","CONSTRAINTS","TRUE","FALSE","IMPORT","DEF","RETURN","NONE",
  ]);
  const HL_TYPES = new Set([
    "STRING","INT","BIGINT","DOUBLE","FLOAT","BOOLEAN","TIMESTAMP","DATE","STRUCT",
    "ARRAY","MAP","VARIANT","BINARY","LONG","SMALLINT","DECIMAL","INTEGER",
  ]);
  function escHtml(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function hlCode(text){
    const re = /(\/\*[\s\S]*?\*\/)|(--[^\n]*|#[^\n]*)|('''[\s\S]*?'''|"""[\s\S]*?""")|('(?:[^'\\]|\\.|'')*'|"(?:[^"\\]|\\.)*")|((?<![A-Za-z0-9_])\d+(?:\.\d+)?(?![A-Za-z0-9_.]))|([A-Za-z_][A-Za-z0-9_]*)/g;
    let out = "", last = 0, m;
    while ((m = re.exec(text))) {
      out += escHtml(text.slice(last, m.index));
      last = re.lastIndex;
      if (m[1] || m[2]) out += '<span class="hl-com">' + escHtml(m[1] || m[2]) + '</span>';
      else if (m[3] || m[4]) out += '<span class="hl-str">' + escHtml(m[3] || m[4]) + '</span>';
      else if (m[5]) out += '<span class="hl-num">' + escHtml(m[5]) + '</span>';
      else if (m[6]) {
        const w = m[6], up = w.toUpperCase();
        const isCall = /^\s*\(/.test(text.slice(re.lastIndex));
        if (HL_KW.has(up)) out += '<span class="hl-kw">' + escHtml(w) + '</span>';
        else if (HL_TYPES.has(up) && w === up) out += '<span class="hl-type">' + escHtml(w) + '</span>';
        else if (isCall) out += '<span class="hl-fn">' + escHtml(w) + '</span>';
        else out += escHtml(w);
      }
    }
    out += escHtml(text.slice(last));
    return out;
  }
  function highlightIn(root){
    root.querySelectorAll("pre code").forEach((c) => {
      if (c.dataset.hl) return;
      c.innerHTML = hlCode(c.textContent);
      c.dataset.hl = "1";
    });
  }

  function renderModule(id) {
    const mod = MODULES.find((m) => m.id === id);
    if (!mod) return;
    tbTitle.textContent = mod.num + " · " + mod.title;
    content.innerHTML = "";
    content.appendChild(el("div", "eyebrow",
      `Module ${mod.num} <span class="w">· cours complet</span>`));
    content.appendChild(el("h2", "section-title", mod.title));
    content.appendChild(el("p", "section-sub", mod.subtitle));
    mod.lessons.forEach((les) => {
      const card = el("div", "lesson");
      card.id = les.id;
      card.appendChild(el("h3", null, les.title));
      const body = el("div");
      body.innerHTML = les.html;
      highlightIn(body);
      card.appendChild(body);
      content.appendChild(card);
    });
  }

  function renderSection(id) {
    const sec = COURSE.find((s) => s.id === id);
    if (!sec) return;
    tbTitle.textContent = sec.title;
    content.innerHTML = "";

    content.appendChild(el("div", "eyebrow",
      `Section ${sec.num} <span class="w">· pondération ${sec.weight}%</span>`));
    content.appendChild(el("h2", "section-title", sec.title));
    content.appendChild(el("p", "section-sub", sec.subtitle));

    sec.lessons.forEach((les) => {
      const card = el("div", "lesson");
      card.id = les.id;
      card.appendChild(el("h3", null, les.title));
      const body = el("div");
      body.innerHTML = les.html;
      highlightIn(body);
      card.appendChild(body);
      content.appendChild(card);
    });
  }

  /* ---------------- Review jump (depuis l'examen) ---------------- */
  function jumpToLesson(sid, lid) {
    state.mode = "course";
    state.activeSection = sid;
    renderSidebar();
    renderSection(sid);
    requestAnimationFrame(() => {
      const node = document.getElementById(lid);
      if (node) {
        node.scrollIntoView({ behavior: "smooth", block: "center" });
        node.classList.remove("flash");
        void node.offsetWidth;
        node.classList.add("flash");
      }
    });
  }

  /* ---------------- Exam setup ---------------- */
  function startExamSetup() {
    tbTitle.textContent = "Examen blanc";
    content.innerHTML = "";

    const head = el("div", "exam-head",
      `<h2>Examen blanc</h2><p>Choisissez les sections et le nombre de questions, puis lancez l'entraînement. Correction immédiate et lien vers le cours.</p>`);
    content.appendChild(head);

    const setup = el("div", "setup");
    setup.appendChild(el("h3", null, "1 · Sections à inclure"));

    const grid = el("div", "opt-grid");
    const selected = new Set(COURSE.map((s) => s.id)); // tout par défaut
    COURSE.forEach((sec) => {
      const n = QUESTIONS.filter((q) => q.sid === sec.id).length;
      const chip = el("button", "chip sel",
        `${sec.num} · ${sec.title}<span class="ck">${n} questions · ✓</span>`);
      chip.onclick = () => {
        if (selected.has(sec.id)) { selected.delete(sec.id); chip.classList.remove("sel"); chip.querySelector(".ck").textContent = `${n} questions`; }
        else { selected.add(sec.id); chip.classList.add("sel"); chip.querySelector(".ck").textContent = `${n} questions · ✓`; }
        updateCount();
      };
      grid.appendChild(chip);
    });
    setup.appendChild(grid);

    setup.appendChild(el("h3", null, "2 · Réglages"));
    const row = el("div", "field-row");
    const fCount = el("div", "field",
      `<label>Nombre de questions</label>
       <select id="ex-count">
         <option value="10">10 (rapide)</option>
         <option value="20">20</option>
         <option value="30">30</option>
         <option value="45" selected>45 (format examen)</option>
         <option value="0">Toutes</option>
       </select>`);
    const fOrder = el("div", "field",
      `<label>Ordre</label>
       <select id="ex-order">
         <option value="shuffle" selected>Aléatoire</option>
         <option value="bysection">Par section</option>
       </select>`);
    row.appendChild(fCount); row.appendChild(fOrder);
    setup.appendChild(row);

    const avail = el("p", "qmeta");
    avail.id = "avail-line";
    setup.appendChild(avail);

    const start = el("button", "btn btn-primary", "Démarrer l'examen →");
    start.onclick = () => {
      if (selected.size === 0) return;
      const order = $("#ex-order").value;
      let want = parseInt($("#ex-count").value, 10);
      let pool = QUESTIONS.filter((q) => selected.has(q.sid));
      if (order === "shuffle") pool = shuffle(pool.slice());
      else pool = pool.slice().sort((a, b) => a.sid.localeCompare(b.sid));
      if (want > 0) pool = pool.slice(0, want);
      launchExam(pool);
    };
    setup.appendChild(start);
    content.appendChild(setup);

    function updateCount() {
      const total = QUESTIONS.filter((q) => selected.has(q.sid)).length;
      $("#avail-line").textContent = `${total} questions disponibles dans la sélection`;
      start.disabled = selected.size === 0;
    }
    updateCount();
  }

  /* ---------------- Exam runtime ---------------- */
  function launchExam(questions) {
    state.exam = {
      questions,
      i: 0,
      answers: new Array(questions.length).fill(null),
      revealed: new Array(questions.length).fill(false)
    };
    renderQuestion();
  }

  function renderQuestion() {
    const ex = state.exam;
    const q = ex.questions[ex.i];
    const sec = COURSE.find((s) => s.id === q.sid);
    content.innerHTML = "";

    // progress
    const answered = ex.answers.filter((a) => a !== null).length;
    const prog = el("div");
    prog.appendChild(el("div", "qprogress",
      `<div class="fill" style="width:${((ex.i) / ex.questions.length) * 100}%"></div>`));
    prog.appendChild(el("div", "qmeta",
      `<span>Question ${ex.i + 1} / ${ex.questions.length}</span><span>${answered} répondues</span>`));
    content.appendChild(prog);

    const card = el("div", "qcard");
    card.appendChild(el("div", "qtag",
      `<span class="tier-dot tier-${sec.tier}"></span> Section ${sec.num} · ${sec.title}`));
    card.appendChild(el("div", "qtext", q.q));

    const answers = el("div", "answers");
    const keys = ["A", "B", "C", "D", "E"];
    const chosen = ex.answers[ex.i];
    const revealed = ex.revealed[ex.i];

    q.opts.forEach((opt, idx) => {
      const a = el("button", "answer");
      a.innerHTML = `<span class="key">${keys[idx]}</span><span>${opt}</span>`;
      if (revealed) {
        a.classList.add("locked");
        if (idx === q.a) a.classList.add("correct");
        if (idx === chosen && chosen !== q.a) a.classList.add("wrong");
      } else if (idx === chosen) {
        a.classList.add("sel");
      }
      a.onclick = () => {
        if (ex.revealed[ex.i]) return;
        ex.answers[ex.i] = idx;
        ex.revealed[ex.i] = true;
        renderQuestion();
      };
      answers.appendChild(a);
    });
    card.appendChild(answers);

    // explanation + review link
    const exp = el("div", "explain" + (revealed ? " show" : ""));
    if (revealed) {
      const ok = chosen === q.a;
      exp.appendChild(el("div", "verdict " + (ok ? "ok" : "no"),
        ok ? "✓ Bonne réponse" : "✗ Réponse incorrecte"));
      exp.appendChild(el("p", null, q.exp));
      const lessonTitle = (sec.lessons.find(l => l.id === q.lid) || {}).title || "";
      const link = el("button", "review-link",
        `📖 Revoir : ${sec.title} → ${lessonTitle}`);
      link.onclick = () => jumpToLesson(q.sid, q.lid);
      exp.appendChild(link);
    }
    card.appendChild(exp);
    content.appendChild(card);

    // nav
    const nav = el("div", "exam-nav");
    const prev = el("button", "btn btn-ghost", "← Précédent");
    prev.disabled = ex.i === 0;
    prev.onclick = () => { ex.i--; renderQuestion(); window.scrollTo(0, 0); };

    const isLast = ex.i === ex.questions.length - 1;
    const next = el("button", "btn btn-primary", isLast ? "Voir le résultat →" : "Suivant →");
    next.onclick = () => {
      if (isLast) { showResults(); }
      else { ex.i++; renderQuestion(); window.scrollTo(0, 0); }
    };
    nav.appendChild(prev); nav.appendChild(next);
    content.appendChild(nav);
  }

  /* ---------------- Results ---------------- */
  function showResults() {
    const ex = state.exam;
    tbTitle.textContent = "Résultat";
    let correct = 0;
    const bySec = {};
    ex.questions.forEach((q, i) => {
      const ok = ex.answers[i] === q.a;
      if (ok) correct++;
      if (!bySec[q.sid]) bySec[q.sid] = { ok: 0, n: 0 };
      bySec[q.sid].n++;
      if (ok) bySec[q.sid].ok++;
    });
    const total = ex.questions.length;
    const pct = Math.round((correct / total) * 100);
    const pass = pct >= 70;

    content.innerHTML = "";
    const r = el("div", "result");

    const circ = 2 * Math.PI * 52;
    const off = circ * (1 - pct / 100);
    const ring = el("div", "scorering");
    ring.innerHTML =
      `<svg width="160" height="160" viewBox="0 0 120 120">
         <circle cx="60" cy="60" r="52" fill="none" stroke="#232c38" stroke-width="11"/>
         <circle cx="60" cy="60" r="52" fill="none" stroke="${pass ? '#3fcf8e' : '#ff4a2e'}"
            stroke-width="11" stroke-linecap="round"
            stroke-dasharray="${circ}" stroke-dashoffset="${off}"/>
       </svg>
       <div class="pct"><b>${pct}%</b><span>${correct}/${total}</span></div>`;
    r.appendChild(ring);

    r.appendChild(el("h2", null, pass ? "Prêt·e pour l'examen 🎯" : "Encore un peu d'entraînement"));
    r.appendChild(el("p", "verdict-line",
      pass ? "Vous dépassez le seuil indicatif de 70%. Continuez à réviser les sections les plus faibles."
           : "Sous le seuil indicatif de 70%. Revoyez en priorité les sections ci-dessous."));

    const bs = el("div", "bysec");
    COURSE.forEach((sec) => {
      const d = bySec[sec.id];
      if (!d) return;
      const p = Math.round((d.ok / d.n) * 100);
      const row = el("div", "row");
      row.innerHTML =
        `<span class="tier-dot tier-${sec.tier}"></span>
         <span class="nm">${sec.num} · ${sec.title}</span>
         <span class="bar"><i style="width:${p}%"></i></span>
         <span class="sc">${d.ok}/${d.n}</span>`;
      bs.appendChild(row);
    });
    r.appendChild(bs);

    const review = el("button", "btn btn-ghost", "Revoir les questions");
    review.onclick = () => { ex.i = 0; renderQuestion(); window.scrollTo(0, 0); };
    const again = el("button", "btn btn-primary", "Nouvel examen");
    again.onclick = () => startExamSetup();
    r.appendChild(review); r.appendChild(again);

    content.appendChild(r);
    window.scrollTo(0, 0);
  }

  /* ---------------- utils ---------------- */
  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  /* ---------------- mobile drawer ---------------- */
  function closeMobile() {
    sidebar.classList.remove("open");
    $("#scrim").classList.remove("show");
  }
  $("#burger").onclick = () => {
    sidebar.classList.toggle("open");
    $("#scrim").classList.toggle("show");
  };
  $("#scrim").onclick = closeMobile;

  /* ---------------- wire mode buttons ---------------- */
  $("#mode-course").onclick = () => setMode("course");
  $("#mode-full").onclick = () => setMode("full");
  $("#mode-exam").onclick = () => setMode("exam");

  /* ---------------- init ---------------- */
  renderSidebar();
  renderSection(state.activeSection);
})();

  </script>
</body>
</html>
