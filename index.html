        id: "w2l12", title: "Tâches conditionnelles & itératives",
        html: `
<p>Trois types de tâches avancés permettent des patterns de workflow sophistiqués : <strong>Run if Conditional Task Dependencies</strong>, <strong>If Else Task</strong> et <strong>For Each Task</strong>. Ces tâches transforment vos workflows d'une simple automatisation en systèmes de traitement de données intelligents, capables de <em>brancher</em>, <em>boucler</em> et prendre des décisions selon les données et les résultats de traitement.</p>
<div class="cards-3">
  <div class="mini-card"><h4>Run if Conditional Task Dependencies</h4><p>Contrôler l'exécution d'une tâche selon les <strong>résultats des tâches amont</strong>, permettant de gérer les échecs partiels et les scénarios de dépendances complexes.</p></div>
  <div class="mini-card"><h4>If Else Task</h4><p>Implémenter une <strong>logique conditionnelle booléenne</strong> directement dans le workflow, autorisant des branches selon les conditions de données, résultats de traitement ou règles métier.</p></div>
  <div class="mini-card"><h4>For Each Task</h4><p>Permettre des patterns de <strong>traitement itératif</strong> où la même logique est appliquée à plusieurs partitions de données ou paramètres, avec un <strong>parallélisme configurable</strong>.</p></div>
</div>

<h4>1) Run if — dépendances conditionnelles entre tâches</h4>
<ul>
<li><strong>Contrôle l'exécution d'une tâche selon les résultats des tâches amont</strong> (<em>upstream tasks</em>).</li>
<li>Supporte une variété de <strong>conditions de dépendance</strong> comme :
  <ul>
    <li><strong>All succeeded</strong> — dépendance traditionnelle : toutes les tâches amont doivent se terminer avec succès avant que la tâche suivante puisse s'exécuter.</li>
    <li><strong>At least one succeeded</strong> — utile quand on a des sources de données ou chemins de traitement <strong>redondants</strong> : le workflow peut avancer si ne serait-ce qu'une des tâches amont requises a réussi.</li>
    <li><strong>None failed</strong> — permet à une tâche de s'exécuter même si certaines tâches amont ont été <em>skippées</em>, tant qu'aucune n'a explicitement échoué.</li>
    <li><strong>And more</strong> — combinaisons personnalisées permettant d'implémenter une logique métier complexe nécessitant des combinaisons spécifiques de résultats de tâches.</li>
  </ul>
</li>
</ul>
<p><strong>Exemple — At Least One Succeeded :</strong></p>

</svg>
<p><strong>Bénéfices des dépendances conditionnelles :</strong> si <code>Task-4</code> est configurée pour s'exécuter quand « au moins une » de ses tâches précédentes (<code>Task-2</code> ou <code>Task-3</code>) réussit, elle peut quand même s'exécuter si <code>Task-3</code> échoue tandis que <code>Task-2</code> réussit. Cela <strong>évite les défaillances en cascade</strong> et permet aux workflows de continuer même quand certains composants échouent. Cela reflète aussi les processus métier réels où plusieurs chemins vers le succès existent et où des échecs partiels n'arrêtent pas toute l'opération.</p>
<ul>
<li>Les dépendances de tâches fournissent une <strong>logique de flux de contrôle basée sur le statut des tâches amont</strong>.</li>
<li>Elles sont <strong>représentées visuellement dans le DAG du job</strong> : différents styles et couleurs de lignes indiquent différents types de dépendances, rendant une logique complexe compréhensible d'un coup d'œil.</li>
</ul>
<p><strong>Comment configurer :</strong> on sélectionne ces conditions de dépendance dans les <strong>réglages de configuration de la tâche</strong>, sous la section « <em>run-if dependencies</em> ».</p>
<div class="callout"><strong>Flux d'exécution (3 étapes observées dans l'UI) :</strong><br/>
<strong>1. Job Initialization</strong> — le système évalue toutes les dépendances et détermine l'ensemble d'exécution initial ; toutes les tâches s'exécutent <em>concurremment</em>.<br/>
<strong>2. Waiting for all tasks to complete</strong> — à mesure que les tâches se terminent (avec succès ou échec), le système réévalue en continu quelles tâches aval peuvent s'exécuter. Exemple : <code>Ingest_Source_2</code> et <code>Ingest_Source_3</code> sont terminées et attendent que <code>Ingest_Source_1</code> se termine avant de passer à la tâche <code>All_Data_Ingested</code>.<br/>
<strong>3. Dependent Task Started</strong> — une fois les trois tâches complétées (All succeeded), la tâche finale démarre.</div>

<h4>2) If/Else — tâches conditionnelles</h4>

<ul>
<li>Ajoute une <strong>logique conditionnelle booléenne</strong> à votre workflow, basée sur les résultats des tâches.</li>

<li>Utilise les <strong>opérateurs booléens</strong> <code>==</code>, <code>!=</code>, <code>&gt;</code>, <code>&gt;=</code>, <code>&lt;</code>, <code>&lt;=</code> pour évaluer les expressions.</li>
</ul>
<p><strong>Exemples de logique métier :</strong></p>
<ul>
<li><strong>Data Quality Gates</strong> — brancher selon les comptages d'enregistrements, pourcentages de valeurs nulles ou résultats de validation.</li>
<li><strong>Processing Volume Decisions</strong> — utiliser des stratégies de traitement différentes pour de gros vs de petits jeux de données.</li>
<li><strong>Environment-Specific Logic</strong> — exécuter des tâches différentes selon les paramètres d'environnement.</li>
<li><strong>Business Rule Implementation</strong> — implémenter des règles métier complexes directement dans la logique du workflow.</li>
</ul>
<p><strong>Prérequis d'exécution :</strong> la condition « <em>If none of dependency failed and at least one task executed</em> » garantit que l'évaluation conditionnelle n'a lieu que lorsque des résultats amont significatifs sont disponibles. <strong>Branches True/False :</strong> chaque branche peut contenir plusieurs tâches, permettant des chemins de traitement complexes selon les résultats conditionnels.</p>

<h4>3) For Each — tâche itérative</h4>

</svg>
<ul>
<li><strong>For Each</strong> boucle sur un <strong>tableau d'entrée</strong> et exécute la <strong>même tâche imbriquée</strong> pour chaque élément, en le passant sous forme de <code>{{input}}</code>.</li>
<li>Les itérations peuvent s'exécuter <strong>en parallèle</strong>, avec une <strong>concurrence configurable</strong> pour accélérer l'exécution.</li>
<li>Les <strong>dépendances aval s'attachent au conteneur For Each</strong>, pas à la tâche imbriquée.</li>
</ul>
<p><strong>Le concept de conteneur :</strong> la tâche For Each agit comme une <strong>unité logique unique</strong> dans votre workflow, même si elle exécute plusieurs itérations en interne. Les tâches aval n'ont besoin de dépendre que du conteneur For Each, et non de chaque itération individuelle, ce qui garde les diagrammes de workflow propres et gérables. Le conteneur gère aussi l'<strong>allocation de ressources</strong> entre itérations, optimisant l'utilisation du cluster et prévenant les conflits de ressources.</p>
<p><strong>Deux composants à définir :</strong></p>
<ol>
<li><strong>The For Each task</strong> — la tâche conteneur de haut niveau qui gère la boucle : logique d'itération, traitement du tableau d'entrée, réglages de concurrence et allocation de ressources.</li>
<li><strong>A nested task</strong> — la tâche réelle qui s'exécute à chaque itération. Elle peut être de n'importe quel type (notebook, SQL, script Python, etc.) ; elle reçoit chaque élément du tableau sous forme de <code>{{input}}</code>.</li>
</ol>
<p>Cette séparation permet de configurer le comportement d'itération <strong>indépendamment</strong> de la logique de traitement, rendant les tâches For Each à la fois puissantes et maintenables.</p>
<p><strong>Exemples de cas d'usage :</strong></p>
<ul>
<li><strong>Geographic Processing</strong> — traiter les données de chaque état/région en parallèle.</li>
<li><strong>Time Period Processing</strong> — gérer différentes plages de dates avec la même logique.</li>
<li><strong>Customer Segment Processing</strong> — appliquer la même analyse à différents segments clients.</li>
<li><strong>File Processing</strong> — traiter plusieurs fichiers avec une logique identique.</li>
</ul>`

        html: `
<p>La gestion des échecs ne consiste pas seulement à relancer des tâches : il s'agit de construire des systèmes <strong>résilients</strong>, capables de récupérer efficacement et de maintenir la cohérence des données même quand des composants tombent.</p>
<h4>Re-run the failed task</h4>
<ul>
<li>La fonctionnalité <strong>Repair</strong> permet de <strong>ré-exécuter et de surcharger les paramètres de tâche</strong>.</li>
<li>Elle <strong>réduit le temps et les ressources</strong> nécessaires pour récupérer d'exécutions de job infructueuses.</li>
<li>En cas d'échec de tâche, vous pouvez :
  <ul>
    <li><strong>modifier la tâche</strong> et relancer ;</li>
    <li><strong>modifier les paramètres</strong> et relancer.</li>
  </ul>
</li>
</ul>
<p><strong>Récupération ciblée :</strong> au lieu de redémarrer des workflows entiers, vous pouvez modifier des tâches échouées spécifiques et ne relancer que ce qui est nécessaire. Cela économise un temps et des ressources de calcul significatifs.</p>
<p><strong>Scénarios de récupération :</strong></p>
<ul>
<li><strong>Configuration Fixes</strong> — corriger des valeurs de paramètres qui ont causé les échecs.</li>
<li><strong>Resource Adjustments</strong> — augmenter la mémoire ou les ressources de compute pour les tâches ayant échoué par contrainte de ressources.</li>
<li><strong>Code Updates</strong> — déployer des correctifs d'erreurs de logique et ne relancer que les tâches concernées.</li>
<li><strong>Data Quality Issues</strong> — ajuster la logique de traitement pour gérer des problèmes de qualité découverts pendant l'exécution.</li>
</ul>

<h4>Ne relancer que les tâches nécessaires</h4>
<p>La fonctionnalité permet de n'exécuter que les tâches échouées, ce qui vous <strong>fait gagner du temps et de l'argent</strong> en ne relançant que le nécessaire plutôt que le job entier.</p>
<ul>
<li><strong>Resource Optimization</strong> — n'exécuter que les tâches échouées au lieu de workflows entiers peut réduire le temps de récupération de <strong>80–90 %</strong> dans des pipelines complexes.</li>
<li><strong>Reduced Risk</strong> — des opérations de récupération plus petites ont moins d'impact sur les ressources système et réduisent le risque de défaillances en cascade pendant la récupération.</li>
<li><strong>Faster Resolution</strong> — les équipes peuvent réagir plus vite aux échecs sans attendre la fin de workflows entiers, améliorant le respect des SLA et la réactivité métier.</li>
</ul>
<div class="callout"><strong>Point d'attention important :</strong> réparer une tâche ne veut pas dire réparer le job. Par exemple, si vous passez un mauvais paramètre et le corrigez via la fonctionnalité <em>repair run</em>, vous devez <strong>toujours modifier ce paramètre dans la définition de votre job</strong>.</div>

<h4>Après la réparation</h4>
<p>Après les opérations de réparation, l'historique des runs du job montre clairement le processus de récupération :</p>
<ul>
<li><strong>Audit Trail</strong> — visibilité complète sur ce qui a été réparé, quand et par qui : une information essentielle pour le dépannage et l'amélioration des processus.</li>
<li><strong>Success Validation</strong> — indication claire des tâches récupérées avec succès, permettant d'avoir confiance dans le processus de réparation.</li>
<li><strong>Learning Opportunities</strong> — les données historiques de réparation aident les équipes à identifier des patterns d'échec et à améliorer la conception initiale des jobs pour prévenir les problèmes futurs.</li>
</ul>`

<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px">
<div style="background:#1c232d;border:1px solid #2b3542;border-left:3px solid #ff4a2e;border-radius:9px;padding:13px">
<div style="font-family:'Space Grotesk',sans-serif;font-size:12.5px;font-weight:600;color:#ff6a52;margin-bottom:6px">Interactive Clusters</div>
<p style="font-size:13px;margin:0 0 8px">Le mieux pour l'analyse ad-hoc, l'exploration de données ou le développement — <strong>mais pas la production</strong> :</p>
<ul style="font-size:13px;margin:0;padding-left:18px">
<li><strong>Costly for Job runs</strong> — les clusters interactifs restent actifs même quand ils n'exécutent pas de job, générant des coûts inutiles.</li>
<li><strong>Limited Scalability</strong> — les ressources partagées peuvent créer de la contention et une performance imprévisible.</li>
<li><strong>Availability could be an issue</strong> à cause de l'usage parallèle — plusieurs utilisateurs partageant les clusters peuvent causer des conflits de ressources et des retards.</li>

<div style="background:#1c232d;border:1px solid #2b3542;border-left:3px solid #e3b23c;border-radius:9px;padding:13px">

<p style="font-size:13px;margin:0 0 8px">Moins chers car ils se terminent à la fin du job, réduisant l'usage des ressources et les coûts. Mais :</p>
<ul style="font-size:13px;margin:0;padding-left:18px">

<li><strong>Maintenance Burden</strong> — davantage de configuration et de gestion que les options serverless.</li>

</ul>

<h4>Selecting Compute — Serverless Compute</h4>
<table class="tbl">
<thead><tr><th style="width:22%">Atout</th><th>Détail</th></tr></thead>

<tr><td><strong>Reliability</strong></td><td>Protégé (<em>shielded</em>) des perturbations du cloud.</td></tr>
</tbody>

<p><strong>Stratégie de décomposition :</strong> décomposer les DAG complexes en <strong>unités métier logiques</strong> plutôt qu'en composants techniques. Chaque module doit représenter une fonction métier cohésive qui peut être développée, testée et déployée indépendamment.</p>
<p><strong>Relations parent-enfant :</strong> les <strong>Parent Jobs</strong> orchestrent des <strong>Child Jobs</strong>, créant une séparation nette des responsabilités tout en maintenant la coordination globale du workflow.</p>
<ul>
<li><strong>Maintainability</strong> — les jobs plus petits sont plus faciles à comprendre, modifier et dépanner.</li>
<li><strong>Reusability</strong> — les child jobs peuvent être réutilisés dans plusieurs workflows parents.</li>
<li><strong>Team Collaboration</strong> — différentes équipes peuvent posséder différents modules tout en collaborant sur le workflow global.</li>
<li><strong>Testing</strong> — les modules individuels peuvent être testés indépendamment, améliorant la qualité et réduisant le risque de déploiement.</li>
</ul>

<h4>Jobs and Git</h4>
<p>Jobs supporte l'<strong>exécution de notebooks depuis Git</strong> :</p>
<ul>
<li>Cela <strong>évite les modifications involontaires de votre job de production</strong> — par exemple, quand un autre utilisateur fait des éditions locales dans un repo « Prod » ou change de branche.</li>
<li>Cela <strong>simplifie le processus de définition du job</strong> en ayant une <strong>source unique de vérité</strong>.</li>
<li>Cela <strong>facilite le déploiement</strong> des notebooks via <strong>CI/CD</strong>.</li>
<li>Les utilisateurs peuvent se connecter à diverses plateformes Git : Databricks supporte <strong>GitHub, GitLab, AWS CodeCommit</strong> et d'autres fournisseurs Git.</li>
</ul>
<div class="demo"><span class="demo-label">Jobs and Git — étapes de configuration</span>
<p><strong>1 — Create task with Git provider as Source :</strong> créez les tâches avec un fournisseur Git comme source, en spécifiant le dépôt, la branche/le tag et les identifiants d'authentification. Cela garantit que votre job exécute toujours la version <em>committée</em> de votre code.</p>
<p><strong>2 — Configure path to main notebook under repository root :</strong> configurez le chemin vers votre notebook principal sous la racine du dépôt, afin que le job puisse localiser et exécuter le bon point d'entrée de votre workflow.</p>
<p class="demo-note"><strong>Bonnes pratiques :</strong> utilisez des branches ou tags spécifiques pour la production plutôt que des branches principales en évolution constante ; mettez en place des processus de revue de code avant de fusionner vers les branches de production ; maintenez une documentation claire sur les dépôts et chemins contenant le code de production.</p>
</div>
<p><strong>Bénéfices de collaboration :</strong> plusieurs développeurs peuvent collaborer sur le développement de workflows en utilisant les workflows Git standards (branches, pull requests, revues de code) tout en maintenant la stabilité de la production.</p>`

        id: "w2l16", title: "Best Practices — synthèse en 3 axes",
        html: `
<p>Voici les bonnes pratiques complètes qui garantissent le succès en production sur tous les aspects de l'implémentation de Lakeflow Jobs.</p>
<div class="cards-3">
  <div class="mini-card"><h4>Compute &amp; Cost Optimization</h4><p>Use job or serverless clusters in production · Avoid interactive clusters for production workloads · Enable Photon for faster and cheaper execution · Reuse clusters to reduce startup time and cost</p></div>
  <div class="mini-card"><h4>Orchestration &amp; Modularity</h4><p>Break complex pipelines into modular jobs/run jobs · Use multi-task jobs for parallel and scalable execution · Apply conditional logic using Run If, If/Else, For Each task · Limit jobs to manageable task counts for maintainability (Limited to 1000 task)</p></div>
  <div class="mini-card"><h4>Monitoring &amp; Governance</h4><p>Use service principals for job ownership and data access · Configure alerts for failures, delays, and completions · Leverage Repair &amp; Run for reducing cost on re-processing · Parameterize tasks for reusability and flexibility</p></div>
</div>

<h4>Compute &amp; Cost Optimization Practices</h4>
<ul>
<li><strong>Production Compute</strong> — utilisez toujours des <strong>job clusters</strong> ou du <strong>compute serverless</strong> en production, pour garantir l'efficacité de coût et l'isolation des ressources.</li>
<li><strong>Interactive Cluster Avoidance</strong> — réservez strictement les clusters interactifs au développement et à l'analyse ad-hoc, afin d'éviter les dépassements de coûts et les conflits de ressources en production.</li>
<li><strong>Photon Enablement</strong> — activez l'accélération <strong>Photon</strong> sur toutes les charges éligibles pour des gains de performance significatifs et des réductions de coût.</li>
<li><strong>Cluster Reuse</strong> — concevez les workflows pour <strong>réutiliser les clusters entre les tâches</strong> quand c'est possible, réduisant les frais de démarrage et améliorant l'efficacité de coût.</li>
</ul>

<h4>Orchestration &amp; Modularity Practices</h4>
<ul>
<li><strong>Modular Architecture</strong> — décomposez les pipelines complexes en modules logiques maintenables en utilisant le pattern de tâche <em>run job</em>, pour une meilleure maintenabilité et collaboration d'équipe.</li>
<li><strong>Multi-Task Design</strong> — tirez parti des jobs multi-tâches pour l'exécution parallèle et une meilleure utilisation des ressources, tout en gardant la clarté du workflow.</li>
<li><strong>Advanced Logic</strong> — implémentez une logique métier sophistiquée à l'aide des tâches <strong>Run If</strong>, <strong>If/Else</strong> et <strong>For Each</strong> pour gérer les scénarios complexes du monde réel.</li>
<li><strong>Task Limitations</strong> — maintenez les jobs individuels sous <strong>1000 tâches</strong> pour préserver la gérabilité et la performance, en utilisant le design modulaire pour les workflows plus larges.</li>
</ul>

<h4>Monitoring &amp; Governance Practices</h4>
<ul>
<li><strong>Service Principal Usage</strong> — utilisez des <strong>service principals</strong> plutôt que des comptes personnels pour la propriété des jobs et l'accès aux données, afin de garantir la continuité et un contrôle d'accès approprié.</li>
<li><strong>Comprehensive Alerting</strong> — configurez des alertes pour les <strong>échecs, retards et complétions</strong>, avec des stratégies d'escalade et de notification appropriées.</li>
<li><strong>Recovery Optimization</strong> — tirez parti des capacités <strong>Repair &amp; Run</strong> pour minimiser les coûts et le temps de récupération lors de la gestion des échecs.</li>
<li><strong>Parameterization</strong> — concevez les tâches avec un <strong>paramétrage</strong> approprié pour une réutilisabilité et une flexibilité maximales entre environnements et cas d'usage.</li>
</ul>`

<h4>Trois causes racines</h4>
<div class="cards-3">
  <div class="mini-card"><h4>Labor-Intensive Development</h4><p><strong>Slow &amp; Error-Prone Pipelines :</strong> retarde les produits data et les insights, ralentissant l'impact métier.</p></div>

</div>

<h4>SDP : « Reliable data pipelines made easy »</h4>
<p>Avec les Lakeflow Spark Declarative Pipelines, laissez votre équipe se concentrer sur ce qui compte vraiment : <strong>écrire et gérer la logique de transformation</strong> ! Plus besoin de s'enliser dans l'orchestration, l'infrastructure ou les opérations de cas limites. Juste des pipelines de données propres et fiables, livrés avec moins d'effort et plus de confiance.</p>
<div class="cards-3">
  <div class="mini-card"><h4>Simplified Pipeline Authoring</h4><p>Déclarez facilement l'ingestion et les transformations en <strong>SQL ou Python</strong>, et laissez SDP gérer le reste : plan d'exécution, gestion des erreurs et gestion des dépendances en coulisses.</p></div>
  <div class="mini-card"><h4>Intelligent Optimization at Scale</h4><p><strong>Scaling et récupération automatiques</strong> améliorent la fiabilité et réduisent la maintenance. À mesure que les volumes croissent, moins d'interventions manuelles et moins de charge opérationnelle.</p></div>
  <div class="mini-card"><h4>Unified Batch and Streaming</h4><p>Les pipelines s'adaptent sans couture aux charges <strong>quasi temps réel</strong> comme <strong>batch</strong>, optimisant performance et coût — sans gérer des systèmes séparés ni réécrire le code.</p></div>
</div>

<h4>Vue d'ensemble du traitement incrémental</h4>
<p>Voyons à haut niveau comment les Declarative Pipelines rendent le traitement incrémental facile. <strong>C'est la raison fondamentale de les utiliser.</strong></p>
<p>Vos données vivent au départ dans une ou plusieurs <strong>sources brutes</strong> — stockage cloud, bases de données, applications SaaS ou files de messages. De là, vous choisissez comment ingérer : <strong>batch</strong> (traitement planifié) ou <strong>streaming</strong> (flux continu). L'un des grands bénéfices est la flexibilité de <strong>basculer facilement entre ces modes</strong> si vos besoins changent.</p>
<p>Typiquement, vous construisez un pipeline ETL bronze, silver et gold. Dans cet exemple simple, nous créons : une <strong>streaming table bronze</strong>, une <strong>streaming table silver</strong> et une <strong>materialized view gold</strong>.</p>

<h4>Run 1 — première exécution</h4>
<ul>
<li>Les données brutes sont ingérées depuis la source et <strong>appendées</strong> à la streaming table bronze.</li>
<li>Le pipeline <strong>transforme</strong> les nouvelles données de la couche bronze selon votre logique de transformation et <strong>appende</strong> les résultats à la streaming table silver.</li>
<li>Enfin, la <strong>materialized view</strong> traite les données au niveau gold. Selon divers facteurs, ce traitement peut être <strong>incrémental ou un full refresh</strong>, garantissant que vos données gold sont toujours à jour. Les materialized views contiennent une variété d'optimisations intégrées lorsqu'elles s'exécutent sur <strong>Serverless</strong>.</li>
</ul>
<h4>Run 2 — exécution suivante</h4>
<ul>
<li>Le pipeline utilise des <strong>checkpoints</strong> pour suivre quelles données ont déjà été ingérées et traitées (<strong>Auto Loader</strong>).</li>
<li>Seules les <strong>nouvelles données</strong> sont ingérées de façon incrémentale et appendées à la streaming table bronze ; le pipeline <strong>ignore les données déjà traitées</strong> pour éviter la surcharge de traitement.</li>
<li>Ensuite, seules les nouvelles données de la table bronze sont transformées de façon incrémentale et appendées à la streaming table silver, en ignorant ce qui a déjà été transformé au premier run.</li>
<li>Enfin, la materialized view traite <strong>l'intégralité</strong> de la streaming table silver au niveau gold. Selon divers facteurs, ce traitement peut être incrémental ou un full refresh.</li>
</ul>
<div class="callout">Cette approche de traitement incrémental améliore l'efficacité en ne traitant que les <strong>nouvelles données non encore traitées</strong>. Elle évite le retraitement inutile des données existantes. Les materialized views ajoutent encore plus de valeur en fournissant des <strong>optimisations intégrées</strong>, rendant plus rapide et efficace l'agrégation ou l'interrogation des streaming tables.</div>

<p>Les deux chemins mènent au <strong>même flux de création de pipeline</strong>, où vous pouvez commencer à définir votre logique d'ingestion et de transformation en SQL ou Python.</p>`

        id: "w3l5", title: "Vue d'ensemble du projet du cours",
        html: `
<p>Tout au long de ce cours, nous construisons ensemble un projet pratique avec les Lakeflow Spark Declarative Pipelines : un pipeline complet, modulaire et prêt pour la production, qui ingère, transforme, joint et agrège des données de commandes, de statuts et de clients depuis des fichiers JSON vers des tables et vues prêtes pour la production.</p>
<p>Le projet commence avec des fichiers stockés dans le <strong>cloud storage</strong>. Pour ce cours, tous les fichiers seront au format <strong>JSON</strong>, mais gardez à l'esprit que Lakeflow supporte de nombreux types de fichiers dans les pipelines réels. Nous construirons <strong>trois flows au sein d'un même pipeline</strong>.</p>

<h4>Flow 1 : Orders</h4>
<ul>
<li>Ingère les fichiers JSON <em>orders</em> dans une streaming table <code>orders_bronze</code>.</li>
<li>Transforme les données en une streaming table <code>orders_silver</code>.</li>
<li>Crée la materialized view <code>gold_orders_by_date</code> résumant le <strong>nombre de commandes par date</strong>.</li>
</ul>
<h4>Flow 2 : Status</h4>
<ul>
<li>Ingère les fichiers JSON <em>status</em> dans une streaming table <code>status_bronze</code>.</li>
<li>Transforme les données en une table <code>status_silver</code>.</li>
<li><strong>Joint</strong> les tables orders et status pour créer la materialized view <code>full_order_info_gold</code>.</li>
<li>Produit deux materialized views additionnelles :
  <ul><li>une pour les commandes annulées — <code>cancelled_orders</code> ;</li><li>une pour les commandes livrées — <code>delivered_orders</code>.</li></ul>
</li>
</ul>
<h4>Flow 3 : Customer Change Data Capture (CDC)</h4>
<ul>
<li>Ingère les fichiers JSON <em>customers</em> dans une table <code>customers_bronze</code>.</li>
<li><strong>Nettoie</strong> les données dans une table bronze raffinée nommée <code>customers_bronze_clean</code>.</li>
<li>Effectue le <strong>CDC</strong> pour suivre les changements de mise à jour de données dans la table <code>type1_customers_silver</code>.</li>
</ul>
<div class="callout">À la fin du cours, vous aurez une expérience pratique de la construction d'une architecture de pipeline <strong>complète, modulaire et prête pour la production</strong> avec les Spark Declarative Pipelines.</div>`
      },
      {
        id: "w3l6", title: "Types de datasets : STREAMING TABLE",
        html: `
<p>Au sein des Declarative Pipelines, il y a <strong>trois principaux types de datasets</strong> avec lesquels vous travaillerez : les <strong>Streaming Tables (ST)</strong>, les <strong>Materialized Views (MV)</strong> et les <strong>Views</strong>. Commençons par les Streaming Tables.</p>
<div class="cards-3">
  <div class="mini-card"><h4>STREAMING TABLE (ST)</h4><p>Une table avec support du traitement de données <strong>streaming ou incrémental</strong>, ne traitant que les <strong>nouvelles données</strong>.</p></div>
  <div class="mini-card"><h4>MATERIALIZED VIEW (MV)</h4><p>Les enregistrements sont traités <em>selon les besoins</em> pour retourner des résultats exacts sur l'état courant des données.</p></div>
  <div class="mini-card"><h4>VIEWS</h4><p>Construisent une <strong>table virtuelle sans données physiques</strong>, basée sur la requête dans vos Declarative Pipelines.</p></div>
</div>
<p>Les Streaming Tables sont conçues spécifiquement pour le traitement de données <strong>streaming ou incrémental</strong>. Cela signifie qu'elles ne traitent que les nouvelles données à mesure qu'elles arrivent, plutôt que de tout retraiter à chaque exécution du pipeline. Cette approche <strong>augmente significativement l'efficacité et diminue le coût</strong>, surtout avec de gros volumes ou des données fréquemment mises à jour.</p>

<h4>STREAMING TABLE — vue d'ensemble</h4>
<ul>
<li>Support du <strong>batch ou du streaming</strong> pour le traitement incrémental des données (<strong>traitement exactly-once</strong> des fichiers).</li>
<li>À chaque rafraîchissement d'une streaming table, les données ajoutées aux tables sources sont <strong>appendées</strong> à la streaming table — vous traitez toujours uniquement les données les plus récentes, sans duplication.</li>
<li>Code SQL qui crée les streaming tables : <code>CREATE OR REFRESH STREAMING TABLE</code>.</li>
<li>En SQL, vous <strong>devez utiliser <code>FROM STREAM read_files()</code></strong> pour invoquer la fonctionnalité <strong>Auto Loader</strong>, permettant les lectures streaming incrémentales et les <strong>checkpoints</strong>. Auto Loader suit automatiquement les nouveaux fichiers et assure une ingestion incrémentale fiable.</li>
<li>Les <strong>noms de fichiers sont garantis d'être lus une seule fois</strong>, dans l'objectif de ne pas avoir de lectures dupliquées dans votre ingestion incrémentale.</li>
</ul>

<h4>Créer une STREAMING TABLE avec SQL — Bronze depuis des fichiers JSON</h4>
<pre><code>CREATE OR REFRESH STREAMING TABLE 1_bronze_db.orders_bronze AS
SELECT
  *,
  current_timestamp() AS processing_time,
  _metadata.file_name AS source_file
FROM STREAM read_files(
  "/Volumes/dbacademy/ops/labuser/orders",
  format =&gt; 'JSON');</code></pre>
<ul>
<li>Crée une streaming table nommée <code>orders_bronze</code> dans le schéma <code>1_bronze_db</code>.</li>
<li>La clause <code>SELECT</code> spécifie les colonnes à lire dans la streaming table depuis votre source de données.</li>
<li>Le mot-clé <strong><code>STREAM</code></strong> indique d'utiliser une <strong>lecture streaming</strong> pour les fichiers source (JSON) — le pipeline traitera les nouveaux fichiers de façon incrémentale à mesure qu'ils arrivent.</li>
<li>La fonction <code>read_files()</code> lit les fichiers sous un emplacement fourni et renvoie les données sous <strong>forme tabulaire</strong>.</li>
</ul>
<p><em>Note : la requête utilise le catalogue par défaut.</em> Cette configuration garantit que seules les nouvelles données sont traitées à chaque exécution, permettant une ingestion efficace et scalable directement depuis le stockage cloud.</p>

<h4>Créer une STREAMING TABLE avec SQL — Silver depuis une ST bronze</h4>
<pre><code>CREATE OR REFRESH STREAMING TABLE 2_silver_db.orders_silver AS
SELECT
  order_id,
  timestamp(order_timestamp) AS order_timestamp,
  customer_id,
  notifications
FROM STREAM 1_bronze_db.orders_bronze;</code></pre>
<ul>
<li>La clause <code>SELECT</code> est l'endroit où vous appliquez votre <strong>logique de transformation SQL</strong> sur les données streaming. Ici l'exemple reste simple, mais en pratique ces transformations peuvent inclure des jointures complexes, des filtres, des dérivations de colonnes, etc.</li>
<li>Le plus important est la clause <code>FROM</code> : utilisez le mot-clé <strong><code>STREAM</code></strong> avec le nom de la <strong>STREAMING TABLE</strong> depuis laquelle vous lisez, afin de ne transformer que les <strong>nouvelles lignes</strong> arrivées dans la table bronze depuis la dernière exécution.</li>
</ul>
<p>Cette configuration garantit que votre table silver reste toujours à jour avec les dernières données traitées, sans retraiter ce qui a déjà été géré.</p>
<div class="demo"><span class="demo-label">Exemple — Bronze et Silver avec propriétés et contraintes</span><p><strong>Bronze</strong> — ingestion incrémentale de JSON via Auto Loader, avec métadonnées et propriétés de table. <code>pipelines.reset.allowed = false</code> empêche un full refresh destructeur du bronze :</p><pre><code>CREATE OR REFRESH STREAMING TABLE 1_bronze_db.status_bronze_demo5
  COMMENT "Ingest raw JSON order status files from cloud storage"
  TBLPROPERTIES (
    "quality" = "bronze",
    "pipelines.reset.allowed" = false
  )
AS
SELECT
  *,
  current_timestamp() AS processing_time,
  _metadata.file_name AS source_file
FROM STREAM read_files("$\{source}/status", format =&gt; "json");</code></pre><p><strong>Silver</strong> — transformation + contraintes qualité (voir leçon Expectations) :</p><pre><code>CREATE OR REFRESH STREAMING TABLE 2_silver_db.status_silver_demo5
(
  CONSTRAINT valid_timestamp   EXPECT (order_status_timestamp &gt; "2021-12-25") ON VIOLATION DROP ROW,
  CONSTRAINT valid_order_status EXPECT (
    order_status IN ('on the way','canceled','return canceled','delivered',
                     'return processed','placed','preparing'))
)
COMMENT "Order with each status and timestamp"
TBLPROPERTIES ("quality" = "silver")
AS
SELECT
  order_id,
  order_status,
  timestamp(status_timestamp) AS order_status_timestamp
FROM STREAM 1_bronze_db.status_silver_demo5;</code></pre></div>`
      },
      {
        id: "w3l7", title: "Types de datasets : MATERIALIZED VIEW",
        html: `
<p>Explorons maintenant les <strong>Materialized Views</strong>, ou MV, qui jouent un rôle clé dans votre pipeline.</p>
<ul>
<li>Les enregistrements sont <strong>traités selon les besoins</strong> (<em>as required</em>) pour retourner des résultats exacts pour l'état courant des données. Les MV sont conçues pour maintenir automatiquement les résultats à jour à mesure que de nouvelles données circulent dans les tables amont.</li>
<li>Utilisées pour des tâches de traitement de données telles que :
  <ul>
    <li>les <strong>transformations</strong> ;</li>
    <li>les <strong>agrégations</strong> ;</li>
    <li>le <strong>pré-calcul de requêtes lentes</strong> ou coûteuses ;</li>
    <li>la mise en cache de <strong>calculs fréquemment utilisés</strong> pour un accès plus rapide.</li>
  </ul>
</li>
</ul>
<p>En utilisant des MV, vous améliorez la performance et simplifiez la logique pour les consommateurs en aval — dashboards, modèles de machine learning, outils analytiques — puisque les données sont pré-calculées pour eux.</p>

<h4>MATERIALIZED VIEW — vue d'ensemble</h4>
<ul>
<li>À chaque <strong>mise à jour</strong> d'une materialized view, les résultats de la requête sont <strong>recalculés</strong> pour refléter les changements dans les datasets amont.</li>
<li><strong>Créée et tenue à jour par le pipeline</strong> — vous n'avez pas à gérer de logique de rafraîchissement manuelle.</li>
<li>Utilisez la syntaxe <code>CREATE OR REFRESH MATERIALIZED VIEW</code>.</li>
<li>Peut être utilisée <strong>n'importe où dans votre pipeline</strong>, pas seulement dans la couche gold — bien qu'elles y soient couramment utilisées, elles sont pertinentes partout où la performance et la réutilisabilité comptent.</li>
<li>Le cas échéant, les résultats sont <strong>rafraîchis de façon incrémentale</strong>, évitant de reconstruire complètement la materialized view à l'arrivée de nouvelles données — <strong>Serverless uniquement</strong>.</li>
<li>Le rafraîchissement incrémental des MV repose sur un <strong>optimiseur basé sur les coûts</strong> (<em>cost-based optimizer</em>) qui alimente des transformations rapides et efficaces sur compute Serverless. En coulisses, cet optimiseur détermine s'il faut rafraîchir incrémentalement ou recalculer entièrement la vue.</li>
</ul>

<h4>Créer une MATERIALIZED VIEW avec SQL — agrégation Gold</h4>
<pre><code>CREATE OR REFRESH MATERIALIZED VIEW 3_gold_db.gold_orders_by_date AS
SELECT
  date(order_timestamp) AS order_date,
  count(*) AS total_daily_orders
FROM 2_silver_db.orders_silver
GROUP BY date(order_timestamp);</code></pre>
<ul>
<li>Crée la materialized view <code>gold_orders_by_date</code> dans le schéma (base de données) <code>3_gold_db</code>, qui résume la table <code>orders_silver</code>.</li>
<li>Spécifiez la table source <strong>sans le mot-clé <code>STREAM</code></strong> pour utiliser la STREAMING table source. C'est parce que les Materialized Views suivent automatiquement les changements et gèrent les rafraîchissements en se basant sur la streaming table amont.</li>
<li><strong>NOTE :</strong> quand c'est possible, les requêtes seront <strong>rafraîchies de façon incrémentale</strong> plutôt que reconstruites de zéro. C'est supporté sur compute Serverless et piloté par un optimiseur basé sur les coûts.</li>
</ul>
<p><em>Note : la requête utilise le catalogue par défaut.</em> Cette approche est idéale pour créer des agrégations de couche gold ou des sorties prêtes pour le métier avec un minimum de surcharge et une haute performance.</p>`
      },
      {
        id: "w3l8", title: "Types de datasets : VIEW & TEMPORARY VIEW, renommages et dépendances",
        html: `
<p>Parlons enfin des <strong>Views</strong> dans les Declarative Pipelines. Les views créent des <strong>tables virtuelles qui ne stockent aucune donnée physique</strong>. Ce sont simplement des représentations logiques basées sur la requête SQL définie dans votre pipeline. Il existe deux types de views avec lesquels vous travaillerez couramment : <strong>TEMPORARY VIEW</strong> et <strong>VIEW</strong>.</p>

<h4>TEMPORARY VIEW — vue d'ensemble</h4>
<ul>
<li>Les temporary views ne sont <strong>persistées que sur la durée de vie du pipeline</strong> et sont <strong>privées au pipeline qui les définit</strong>.</li>
<li>Elles <strong>ne sont pas enregistrées comme objet dans Unity Catalog</strong> — elles restent internes et isolées.</li>
<li>Utilisez l'instruction <code>CREATE TEMPORARY VIEW</code>.</li>
<li>Les TEMPORARY VIEWS sont utiles comme <strong>requêtes intermédiaires qui ne sont pas exposées aux utilisateurs finaux</strong> — ou à d'autres pipelines — mais qui supportent la logique de votre pipeline.</li>
</ul>

<h4>VIEW — vue d'ensemble</h4>
<ul>
<li>Construit une <strong>table virtuelle sans données physiques</strong> basée sur le result-set d'une requête SQL dans vos pipelines.</li>
<li>Contrairement aux temporary views, elles <strong>sont enregistrées comme objet dans Unity Catalog</strong>, ce qui les rend disponibles et gérables dans tout votre environnement.</li>
<li>Utilisez l'instruction <code>CREATE VIEW</code>.</li>
</ul>
<div class="callout"><strong>LIMITATIONS :</strong><br/>
• Le pipeline <strong>doit être un pipeline Unity Catalog</strong> pour créer ces views.<br/>
• Les views <strong>ne peuvent pas avoir de requêtes streaming</strong>, ni être utilisées comme <strong>source streaming</strong> pour un pipeline.</div>

<h4>Renommages depuis DLT</h4>
<p>Les utilisateurs existants de DLT remarqueront que les noms ont évolué. Les <strong>sémantiques restent les mêmes</strong>, et l'ancienne syntaxe reste supportée pour la compatibilité. L'objectif est de <strong>simplifier la syntaxe</strong> et de mieux s'aligner sur les autres systèmes et standards de l'industrie.</p>
<table class="tbl">
<thead><tr><th>Syntaxe actuelle</th><th>Deprecated (ancienne syntaxe DLT)</th></tr></thead>
<tbody>
<tr><td><code>CREATE OR REFRESH STREAMING TABLE</code></td><td><code>CREATE OR REFRESH STREAMING LIVE TABLE</code></td></tr>
<tr><td><code>CREATE OR REFRESH MATERIALIZED VIEW</code></td><td><code>CREATE OR REFRESH LIVE TABLE</code></td></tr>
<tr><td><code>CREATE VIEW</code> / <code>CREATE TEMPORARY VIEW</code></td><td><code>CREATE LIVE VIEW</code> / <code>CREATE TEMPORARY LIVE VIEW</code></td></tr>
</tbody>
</table>

<h4>Les dépendances du pipeline sont parsées automatiquement</h4>
<p>Une des fonctionnalités puissantes des Declarative Pipelines est que <strong>les dépendances du pipeline sont automatiquement parsées</strong> : <strong>l'ordre du code n'est pas requis</strong>. Toutes les dépendances sont connectées en coulisses dans le <strong>Declarative Pipeline Graph</strong>, ce qui garantit que les données circulent correctement d'une étape à la suivante.</p>

  <rect x="14" y="22" width="212" height="70" rx="5" fill="#0a0d11" stroke="#2b3542"/>
  <text x="22" y="34" class="cd">CREATE OR REFRESH STREAMING TABLE</text>
  <text x="22" y="44" class="cd">  1_bronze_db.orders_bronze AS</text>

  <text x="22" y="64" class="cd">FROM STREAM read_files(</text>

  <rect x="240" y="22" width="212" height="70" rx="5" fill="#0a0d11" stroke="#2b3542"/>
  <text x="248" y="34" class="cd">CREATE OR REFRESH STREAMING TABLE</text>
  <text x="248" y="44" class="cd">  2_silver_db.orders_silver AS</text>
  <text x="248" y="54" class="cd">SELECT order_id,</text>
  <text x="248" y="64" class="cd">  timestamp(order_timestamp) ...</text>
  <text x="248" y="74" class="cd">FROM STREAM</text>
  <text x="248" y="84" class="cd">  1_bronze_db.orders_bronze;</text>
  <rect x="466" y="22" width="220" height="70" rx="5" fill="#0a0d11" stroke="#2b3542"/>
  <text x="474" y="34" class="cd">CREATE OR REFRESH MATERIALIZED VIEW</text>
  <text x="474" y="44" class="cd">  3_gold_db.gold_orders_by_date AS</text>

<h4>2 · Code Assets</h4>
<p>Ce réglage contrôle quels fichiers de code votre pipeline utilise pendant l'exécution.</p>

<li>La section <strong>source code</strong> référence et inclut les <strong>sous-dossiers (ou fichiers)</strong> du pipeline : <code>.py</code>, <code>.sql</code>, notebooks — typiquement des sous-dossiers et fichiers au sein du dossier racine.</li>
</ul>
<p>Ensemble, ces réglages garantissent que votre pipeline s'exécute avec exactement le code dont il a besoin, organisé et versionné dans le cadre de votre projet.</p>

<h4>3 · Configuration (parameters)</h4>
<p>La configuration d'un pipeline est une <strong>map de paires clé-valeur</strong> qui peut être utilisée pour <strong>paramétrer votre code</strong> :</p>
<ul>
<li><strong>Améliore la lisibilité et la maintenabilité</strong> du code en centralisant les valeurs clés ;</li>
<li>permet de <strong>réutiliser des paramètres communs dans plusieurs fichiers de pipeline</strong>, évitant de coder les valeurs en dur.</li>

<pre><code>CREATE STREAMING TABLE bronze AS
SELECT *
FROM STREAM read_files(

  format =&gt; 'JSON');</code></pre>

      {
        id: "w3l11", title: "Qualité des données : les Expectations",
        html: `
<p>Dans cette leçon, vous apprendrez à créer et ajouter des <strong>expectations de qualité de données</strong> à vos pipelines, à les appliquer pour valider les données streaming, et à comprendre les actions disponibles pour gérer les enregistrements qui échouent aux contrôles de qualité.</p>
<p>Avec les Lakeflow Spark Declarative Pipelines, vous pouvez appliquer des <strong>règles de qualité de données</strong> pour valider les lignes pendant les processus ETL et obtenir des insights sur l'intégrité des données, en utilisant la syntaxe suivante :</p>
<pre><code>CONSTRAINT &lt;constraint-name&gt; EXPECT (&lt;column condition&gt;) [ON VIOLATION &lt;action&gt;]</code></pre>
<p>Ces règles valident vos données <strong>ligne par ligne</strong>. Vous pouvez spécifier <strong>trois types d'actions</strong> quand une violation se produit :</p>
<table class="tbl">
<thead><tr><th style="width:12%">Action</th><th style="width:44%">Exemple de syntaxe SQL</th><th>Résultat</th></tr></thead>
<tbody>
<tr>
  <td><strong>WARN</strong><br/><span style="color:#8a97a8;font-size:12px">(default)</span></td>
  <td><code>CONSTRAINT valid_notification EXPECT (notifications IN ('Y','N'))</code></td>
  <td><ul style="margin:0;padding-left:16px"><li>Les lignes invalides sont <strong>quand même écrites</strong> dans la cible.</li><li>Les logs incluent les <strong>comptes de valides vs invalides</strong> et d'autres métriques.</li></ul>Cela permet de monitorer la qualité sans arrêter le pipeline.</td>
</tr>
<tr>
  <td><strong>DROP</strong></td>
  <td><code>CONSTRAINT valid_date EXPECT (order_timestamp &gt; "2021-01-01") ON VIOLATION DROP ROW</code></td>
  <td><ul style="margin:0;padding-left:16px"><li>Les lignes invalides sont <strong>écartées</strong> de la table.</li><li>Le <strong>compte est journalisé</strong> aux côtés des autres métriques, pour l'audit.</li></ul></td>
</tr>
<tr>
  <td><strong>FAIL</strong></td>
  <td><code>CONSTRAINT valid_id EXPECT (customer_id IS NOT NULL) ON VIOLATION FAIL UPDATE</code></td>
  <td><ul style="margin:0;padding-left:16px"><li>Provoque l'<strong>échec d'un seul flow</strong> et <strong>ne fait pas échouer les autres flows</strong> de votre pipeline.</li><li>Une <strong>intervention manuelle est requise</strong>.</li></ul>Cela aide à détecter les problèmes critiques qui doivent être résolus avant de poursuivre.</td>
</tr>
</tbody>
</table>

<h4>Exemple — ajouter des expectations de qualité</h4>
<p>Créons une streaming table nommée <code>orders_silver</code> avec les trois contraintes :</p>
<pre><code>CREATE OR REFRESH STREAMING TABLE 2_silver_db.orders_silver
(
  CONSTRAINT valid_notifications EXPECT (notifications IN ('Y','N')),
  CONSTRAINT valid_date EXPECT (order_timestamp &gt; "2021-01-01") ON VIOLATION FAIL UPDATE,
  CONSTRAINT valid_id   EXPECT (customer_id IS NOT NULL) ON VIOLATION DROP ROW
)
AS
SELECT
  order_id,
  timestamp(order_timestamp) AS order_timestamp,
  customer_id,
  notifications
FROM STREAM 1_bronze_db.orders_bronze;</code></pre>
<ul>
<li><strong>WARN</strong> (métrique) — <code>CONSTRAINT valid_notifications EXPECT (notifications IN ('Y','N'))</code></li>
<li><strong>FAIL THE PIPELINE</strong> — <code>CONSTRAINT valid_date EXPECT (order_timestamp &gt; "2021-01-01") ON VIOLATION FAIL UPDATE</code></li>
<li><strong>DROP the row</strong> — <code>CONSTRAINT valid_id EXPECT (customer_id IS NOT NULL) ON VIOLATION DROP ROW</code></li>
</ul>

<h4>Actions Overview — le parcours d'une ligne</h4>

<p>Voici ce qui se passe étape par étape :</p>
<ol>
<li>Une <strong>ligne de données</strong> entre dans le pipeline.</li>
<li>Cette ligne est <strong>évaluée</strong> contre les expectations (contraintes) définies.</li>
</ol>
<ul>
<li>Si la ligne <strong>passe</strong> toutes les expectations, elle est <strong>conservée</strong> et le pipeline continue son traitement normalement.</li>
<li>Si la ligne <strong>échoue</strong> à une expectation, l'action définie dans la contrainte détermine la suite :
  <ul>
    <li><strong>WARN</strong> (défaut) : l'échec est journalisé, la ligne est <strong>quand même incluse</strong>, et le pipeline continue.</li>
    <li><strong>DROP</strong> : la ligne est <strong>écartée</strong>, mais le pipeline continue à traiter les données restantes.</li>
    <li><strong>FAIL</strong> : le pipeline <strong>échoue immédiatement pour ce flow spécifique</strong> et une intervention manuelle est requise. Les autres flows ne sont pas affectés.</li>
  </ul>
</li>
</ul>
<div class="callout">Depuis le <strong>Q2 2025</strong>, toutes les <strong>materialized views qui utilisent des expectations</strong> seront <strong>toujours entièrement rafraîchies</strong> lors des exécutions du pipeline.</div>
<div class="demo"><span class="demo-label">Exemple — Expectations (3 niveaux d'action)</span><p>Les contraintes <code>EXPECT</code> définissent la politique sur violation : <strong>warn</strong> (par défaut, on garde la ligne), <strong>DROP ROW</strong> (on rejette la ligne), <strong>FAIL UPDATE</strong> (on échoue le flow) :</p><pre><code>CREATE STREAMING TABLE 1_bronze_db.customers_bronze_clean_demo6
(
  CONSTRAINT valid_id        EXPECT (customer_id IS NOT NULL) ON VIOLATION FAIL UPDATE,
  CONSTRAINT valid_operation EXPECT (operation  IS NOT NULL) ON VIOLATION DROP ROW,
  CONSTRAINT valid_name      EXPECT (name IS NOT NULL OR operation = "DELETE"),   -- warn seulement
  CONSTRAINT valid_address   EXPECT (
    (address IS NOT NULL AND city IS NOT NULL AND state IS NOT NULL AND zip_code IS NOT NULL)
    OR operation = "DELETE")
)
COMMENT "Clean raw bronze + data quality constraints"
AS
SELECT *, CAST(from_unixtime(timestamp) AS timestamp) AS timestamp_datetime
FROM STREAM 1_bronze_db.customers_bronze_raw_demo6;</code></pre></div>`

      {
        id: "w3l12", title: "Vue d'ensemble des jointures en streaming",
        html: `
<p>Dans cette leçon, vous apprendrez les fondamentaux des <strong>jointures streaming</strong> : comment réaliser des <strong>stream-snapshot joins</strong>, joindre des streaming tables à l'aide de <strong>materialized views</strong>, et exécuter des <strong>stream-stream joins</strong> pour combiner des données temps réel de plusieurs sources.</p>

<h4>1 · Stream-Snapshot Join — Streaming Table vers Static Table</h4>
<p><strong>L'objectif est de joindre de façon incrémentale les nouvelles données avec une table statique.</strong> Dans ce pattern, on joint incrémentalement les nouvelles données d'une streaming table à une <strong>table de lookup statique</strong> pour créer une autre streaming table.</p>
<p>Par exemple, imaginez que vous ingérez un flux de transactions qui inclut une colonne <code>country_code</code>. Vous pouvez le joindre avec une table de référence statique qui associe chaque code au nom complet du pays. C'est utile quand vous voulez <strong>enrichir vos données streaming</strong> avec des informations de référence qui ne changent pas souvent.</p>
<svg viewBox="0 0 700 200" style="width:100%;height:auto;background:#1c232d;border:1px solid #2b3542;border-radius:9px;margin-bottom:14px" xmlns="http://www.w3.org/2000/svg">

<ul>
<li>À mesure que de nouvelles données arrivent dans votre streaming table, elles sont jointes <strong>en temps réel</strong> avec la table de référence statique.</li>
<li>Chaque nouvel enregistrement de la streaming table est confronté à <strong>toutes les données disponibles</strong> dans la table statique, assurant une jointure complète et exacte à chaque fois.</li>
<li>Le résultat de cette jointure est ensuite <strong>appendé</strong> à votre streaming table de sortie finale, poursuivant le flux du pipeline.</li>
<li>Point clé : à mesure que de nouvelles données sont appendées à la streaming table source, <strong>seules les nouvelles lignes</strong> sont jointes avec l'intégralité de la table de lookup. C'est une <strong>jointure incrémentale</strong> : la table statique n'a pas besoin d'être retraitée, seules les données streaming entrantes sont évaluées.</li>
</ul>
<p>C'est efficace, fiable, et cela fonctionne bien puisqu'<strong>un seul côté de la jointure</strong> — la streaming table — change au fil du temps. Excellent pattern pour enrichir des données streaming avec du contexte : convertir des codes pays, des IDs produits ou des rôles utilisateurs en formats lisibles.</p>

<h4>2 · Joindre des Streaming Tables avec une Materialized View</h4>
<p><strong>L'objectif est de prendre toutes les lignes de deux streaming tables et de les joindre ensemble à chaque exécution du pipeline.</strong> Ce type de jointure est typiquement utilisé quand <strong>les deux jeux de données d'entrée changent en continu</strong> et que vous devez les combiner régulièrement pour produire un résultat unifié et à jour.</p>

<ul>
<li>À mesure que de nouvelles données sont appendées <strong>aux deux streaming tables</strong>, la materialized view détecte les changements et réagit en conséquence.</li>
<li>À chaque exécution du pipeline, la materialized view <strong>calcule efficacement la jointure</strong> en traitant toutes les données courantes des deux streaming tables.</li>
<li>Cela garantit que chaque nouvel enregistrement de l'un ou l'autre côté est correctement apparié, produisant une sortie complète et à jour.</li>
<li>L'usage d'une materialized view permet à la jointure de <strong>passer à l'échelle efficacement</strong>, en tirant parti du <strong>rafraîchissement incrémental</strong> quand c'est possible pour éviter le recalcul inutile.</li>
</ul>
<p>Exemple : un flux contient l'activité client et un autre les mises à jour du catalogue produits. On peut les joindre via une materialized view pour enrichir les données d'activité avec les informations produit les plus récentes. Parce que <strong>les deux côtés sont streaming</strong>, une materialized view est <strong>requise</strong> pour gérer cette jointure efficacement et garder les résultats courants.</p>
<div class="demo"><span class="demo-label">Exemple — joindre deux ST via une Materialized View</span><p>Une façon de joindre deux streaming tables : une <strong>materialized view</strong> qui exécute un inner join complet. Noter que <strong>le mot-clé <code>STREAM</code> n'est pas utilisé</strong> quand on référence les ST dans la MV :</p><pre><code>CREATE OR REFRESH MATERIALIZED VIEW 3_gold_db.full_order_info_gold_demo5
  COMMENT "Join orders + order status (tous les statuts par commande)"
  TBLPROPERTIES ("quality" = "gold")
AS
SELECT
  orders.order_id, orders.order_timestamp,
  status.order_status, status.order_status_timestamp
FROM 2_silver_db.status_silver_demo5 status
INNER JOIN 2_silver_db.orders_silver_demo5 orders
  ON orders.order_id = status.order_id;</code></pre><p>Puis des MV Gold dérivées, p.ex. les commandes annulées avec délai calculé via <code>datediff()</code> :</p><pre><code>CREATE OR REFRESH MATERIALIZED VIEW 3_gold_db.cancelled_orders_gold_demo5
  TBLPROPERTIES ("quality" = "gold")
AS
SELECT order_id, order_timestamp, order_status, order_status_timestamp,
  datediff(DAY, order_timestamp, order_status_timestamp) AS days_to_cancel
FROM 3_gold_db.full_order_info_gold_demo5
WHERE order_status = 'canceled';</code></pre></div>

<h4>3 · Incremental Stream to Stream Joins</h4>
<div class="callout"><strong>Hors du périmètre du cours</strong> (<em>Outside the scope of the course</em>) — voir le cours <em>Databricks Streaming and DLT (Advanced)</em>.</div>
<p><strong>L'objectif est de joindre de façon incrémentale les nouvelles données de deux tables ; les données passées ne sont pas utilisées.</strong> Le dernier type de jointure streaming est le <strong>stream-stream join</strong>, conçu pour joindre incrémentalement les nouvelles données de deux streaming tables à mesure qu'elles arrivent. Dans ce pattern, seules les nouvelles données entrantes de chaque flux sont jointes ; les données passées ne sont pas considérées à chaque exécution.</p>
<p>Ces jointures sont utiles pour détecter des relations entre des événements qui se produisent <strong>proches dans le temps</strong>, comme joindre des données de clickstream avec des impressions publicitaires temps réel. Cependant, parce que les stream-stream joins impliquent souvent de la <strong>logique de fenêtrage</strong> (<em>windowing</em>), du <strong>watermarking</strong> et d'autres concepts streaming avancés, ils sont hors du périmètre de ce cours.</p>`

<h4>Common Production Tasks</h4>
<p>Quand vous êtes prêt à déplacer votre Lakeflow Spark Declarative Pipeline en production, il y a des <strong>tâches opérationnelles clés</strong> pour garantir qu'il soit fiable, automatisé et monitoré :</p>
<div class="cards-3">
  <div class="mini-card"><h4>Scheduling</h4><p>Définir une planification pour l'exécution automatique (par ex. toutes les 15 minutes, horaire, quotidienne, continue). Cela garantit que vos données sont rafraîchies régulièrement sans déclencheur manuel.</p></div>

  <div class="mini-card"><h4>Monitor pipelines</h4><p>Utiliser l'<strong>Event Log</strong> pour consulter les informations détaillées d'exécution : statut, comptes de lignes, erreurs, avertissements et métriques de performance.</p></div>
</div>

<h4>1 · Scheduling — deux modes de déclenchement</h4>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px">
<div style="background:#1c232d;border:1px solid #2b3542;border-left:3px solid #ff4a2e;border-radius:9px;padding:13px">
<div style="font-family:'Space Grotesk',sans-serif;font-size:12.5px;font-weight:600;color:#ff6a52;margin-bottom:6px">Triggered</div>
<ul style="font-size:13px;margin:0;padding-left:18px">
<li>Peut être déclenché <strong>manuellement</strong> ou s'exécuter <strong>sur une planification</strong> récurrente.</li>
<li><strong>Rafraîchit les tables sélectionnées</strong> en utilisant les données disponibles au démarrage de l'exécution, puis <strong>s'arrête</strong> une fois la mise à jour terminée.</li>
<li>Idéal pour le <strong>traitement batch</strong> ou les pipelines qui n'ont pas besoin de tourner en permanence.</li>
</ul>
</div>
<div style="background:#1c232d;border:1px solid #2b3542;border-left:3px solid #3fcf8e;border-radius:9px;padding:13px">
<div style="font-family:'Space Grotesk',sans-serif;font-size:12.5px;font-weight:600;color:#3fcf8e;margin-bottom:6px">Continuous</div>
<ul style="font-size:13px;margin:0;padding-left:18px">

<ul>
<li>quand le pipeline <strong>démarre</strong> ;</li>
<li>quand le pipeline <strong>réussit</strong> ;</li>

<li>ou pour <strong>n'importe quelle combinaison</strong> des trois événements.</li>

<h4>3 · Monitor pipelines — l'Event Log</h4>
<p>Les Spark Declarative Pipelines fournissent un <strong>pipeline event log</strong> qui capture toutes les informations clés du pipeline :</p>

<h4>Interroger l'event log du pipeline</h4>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px">
<div style="background:#1c232d;border:1px solid #2b3542;border-left:3px solid #e3b23c;border-radius:9px;padding:13px">

<div style="font-family:'Space Grotesk',sans-serif;font-size:12.5px;font-weight:600;color:#aeb9c7;margin-bottom:6px">(DEFAULT) Table Delta cachée</div>

<p>Une fois publié, vous pouvez interroger l'event log comme n'importe quelle autre table Delta, ce qui vous permet de construire des <strong>rapports personnalisés</strong>, des <strong>dashboards</strong> ou de réaliser des analyses plus poussées sur l'activité et la santé du pipeline.</p>
<div class="demo"><span class="demo-label">Exemple — analyser la qualité via l'event log</span><p>L'event log expose les résultats des expectations. On explose le JSON <code>flow_progress</code> pour compter lignes passées/échouées par dataset et par contrainte :</p><pre><code>CREATE OR REPLACE TEMPORARY VIEW dq_source_vw AS

      "array&lt;struct&lt;name: string, dataset: string, passed_records: int, failed_records: int&gt;&gt;")
  ) AS row_expectations

WHERE event_type = 'flow_progress';

SELECT
  row_expectations.dataset AS dataset,
  row_expectations.name    AS expectation,
  SUM(row_expectations.passed_records) AS passing_records,
  SUM(row_expectations.failed_records) AS warnings_records
FROM dq_source_vw
GROUP BY row_expectations.dataset, row_expectations.name
ORDER BY dataset;</code></pre></div>

<p>Le CDC est <strong>catégorisé en différents types de Slowly Changing Dimensions (SCD)</strong>, qui représentent la façon dont les changements historiques sont gérés. Deux types principaux :</p>
<ul>
<li><strong>SCD Type 1</strong> — écrase les données existantes (pas de suivi de l'historique).</li>
<li><strong>SCD Type 2</strong> — suit les changements historiques en stockant les versions précédentes des enregistrements.</li>
</ul>
<p><em>Exemple concret :</em> imaginez une table <code>customers</code>. La source contient de nouveaux enregistrements clients, ainsi que des mises à jour et des suppressions de clients existants. On veut appliquer ces changements à la table cible en utilisant la logique SCD Type 1 ou SCD Type 2.</p>

<h4>SCD Type 1 — Overwrite Target with Latest Values</h4>
<ul>
<li>Quand un enregistrement est <strong>mis à jour</strong> par sa/ses clé(s), l'enregistrement précédent est <strong>simplement écrasé</strong> par la nouvelle valeur, et <strong>aucun historique de version n'est conservé</strong>.</li>
<li>Quand un enregistrement est <strong>supprimé</strong> par sa clé, l'enregistrement est <strong>retiré</strong> de la table cible.</li>
<li>Il n'y a <strong>aucun suivi des anciennes clés (lignes)</strong> : seule la donnée courante est conservée.</li>
</ul>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px">
<div>
<p style="font-size:13px;margin:0 0 6px"><strong><code>customers</code></strong> — <em>target table with all customers</em> (avant)</p>
<table class="tbl" style="font-size:12px">
<thead><tr><th>CustomerID</th><th>Name</th><th>Address</th><th>ProcessDate</th></tr></thead>
<tbody>
<tr><td>1</td><td>Peter</td><td>1 Blue Rd.</td><td>5/1/2025</td></tr>
<tr><td>2</td><td>Samarth</td><td>22 Front St</td><td>5/1/2025</td></tr>
</tbody>
</table>
</div>
<div>
<p style="font-size:13px;margin:0 0 6px"><strong><code>updates</code></strong> — <em>source table with updates</em></p>
<table class="tbl" style="font-size:12px">
<thead><tr><th>CustomerID</th><th>Name</th><th>Address</th><th>Operation</th><th>ProcessDate</th></tr></thead>
<tbody>
<tr><td>1</td><td>Peter</td><td>99 Sunny St.</td><td>UPDATE</td><td>5/15/2025</td></tr>
<tr><td>1</td><td>Peter</td><td>123 Main St.</td><td>UPDATE</td><td>5/20/2025</td></tr>
<tr><td>2</td><td>null</td><td>null</td><td>DELETE</td><td>5/20/2025</td></tr>
<tr><td>3</td><td>Kostas</td><td>100 Athens Dr.</td><td>NEW</td><td>5/20/2025</td></tr>
</tbody>
</table>
</div>
</div>
<p>L'objectif est de mettre à jour la table <code>customers</code> avec les nouvelles informations client issues de la table source <code>updates</code>. En appliquant le SCD Type 1, la table cible est mise à jour avec les dernières informations, sans conserver de versions historiques, en se basant sur <code>CustomerID</code> (colonne ID) et <code>ProcessDate</code> (colonne de séquence) :</p>
<ul>
<li><strong>Peter (customer_id 1)</strong> — son adresse est mise à jour à la <strong>dernière adresse selon le ProcessDate</strong>, soit <code>123 Main St.</code> (<em>Update the row</em>).</li>
<li><strong>Samarth (customer_id 2)</strong> — il a été supprimé, donc sa ligne est retirée de la table cible (<em>Delete the row</em>).</li>
<li><strong>Kostas (customer_id 3)</strong> — c'est un nouveau client, son enregistrement est inséré dans la table (<em>Insert the row</em>).</li>
</ul>
<p style="font-size:13px;margin:0 0 6px"><strong>Updated SCD Type 1 Table</strong> (résultat)</p>
<table class="tbl" style="font-size:12px">
<thead><tr><th>CustomerID</th><th>Name</th><th>Address</th><th>ProcessDate</th></tr></thead>
<tbody>
<tr><td>1</td><td>Peter</td><td>123 Main St.</td><td>5/20/2025</td></tr>
<tr><td>3</td><td>Kostas</td><td>100 Athens Dr.</td><td>5/20/2025</td></tr>
</tbody>
</table>
<div class="callout">La table <code>customers</code> contient un <strong>instantané courant de tous les clients actifs</strong>, sans historique — juste les clients les plus récents. C'est la stratégie CDC la plus simple. <strong>Utilisez le SCD Type 1 quand seules les données courantes comptent et que les valeurs historiques sont sans importance.</strong></div>

<h4>SCD Type 2 — Historical Tracking / Versioning</h4>
<p><em>(Outside the scope of the course)</em></p>
<ul>
<li>Quand un enregistrement change :
  <ul>
    <li>l'<strong>ancien enregistrement est préservé</strong> avec une colonne additionnelle indiquant sa <strong>période de validité</strong> (date de début, date de fin ou un flag « courant »), et un <strong>nouvel enregistrement est inséré</strong> avec l'information mise à jour ;</li>
    <li>quand un enregistrement est marqué comme supprimé, l'<strong>enregistrement est conservé</strong> et une colonne indique qu'il est <strong>inactif</strong>.</li>
  </ul>
</li>
<li>Utilisé quand les <strong>données historiques sont importantes</strong> et que le système doit suivre comment les attributs changent au fil du temps (comme suivre les changements d'adresse ou de statut d'un client).</li>
</ul>
<p style="font-size:13px;margin:0 0 6px">Exemple de table cible <code>customers</code> avec SCD Type 2 :</p>
<table class="tbl" style="font-size:12px">
<thead><tr><th>CustomerID</th><th>Name</th><th>Address</th><th>ProcessDate</th><th>__START_AT</th><th>__END_AT</th></tr></thead>
<tbody>
<tr><td>1</td><td>Peter</td><td>123 Main St.</td><td>5/20/2025</td><td>5/20/2025</td><td><strong>null</strong></td></tr>
<tr><td>1</td><td>Peter</td><td>1 Blue Rd.</td><td>5/1/2025</td><td>5/1/2025</td><td>5/20/2025</td></tr>
<tr><td>2</td><td>Samarth</td><td>22 Front St</td><td>5/1/2025</td><td>5/1/2025</td><td>5/20/2025</td></tr>
<tr><td>3</td><td>Kostas</td><td>100 Athens Dr.</td><td>5/20/2025</td><td>5/20/2025</td><td><strong>null</strong></td></tr>
</tbody>
</table>
<p>Deux colonnes de métadonnées importantes ont été ajoutées à la table cible — ces <strong>colonnes indiquent les lignes actives et inactives</strong> :</p>
<ul>
<li><code>__START_AT</code> — montre <strong>quand la ligne est devenue active</strong> ;</li>
<li><code>__END_AT</code> — montre <strong>quand la ligne est devenue inactive</strong> (si c'est le cas). Les <strong>valeurs nulles indiquent la ligne courante</strong> ; les <strong>valeurs non nulles indiquent les lignes inactives (historiques)</strong>.</li>
</ul>
<p><strong>Décomposition de l'exemple :</strong></p>
<ul>
<li><strong>Customer ID 1 – Peter</strong> : deux enregistrements existent. L'enregistrement <em>actif</em> montre l'adresse mise à jour de Peter (<code>__END_AT</code> est null → toujours actif ; <code>__START_AT</code> marque quand la mise à jour s'est produite). L'enregistrement <em>inactif</em> conserve l'ancienne adresse de Peter — on sait qu'il est inactif car <code>__END_AT</code> est renseigné → plus courant.</li>
<li><strong>Customer ID 2 – Samarth</strong> : puisqu'il a supprimé son compte, son enregistrement existant est désormais <strong>inactif</strong>. Une date est ajoutée à <code>__END_AT</code> pour indiquer quand il a été retiré.</li>
<li><strong>Customer ID 3 – Kostas</strong> : nouveau client, son enregistrement a été inséré dans la table. <code>__START_AT</code> montre quand il a rejoint ; <code>__END_AT</code> est null → l'enregistrement est actuellement actif.</li>
</ul>

<h4>Utiliser AUTO CDC INTO (anciennement APPLY CHANGES INTO)</h4>
<p>Lakeflow fournit un mécanisme CDC déclaratif intégré via l'instruction <strong><code>AUTO CDC INTO</code></strong>. Vous l'utilisez pour gérer les <strong>updates, inserts et deletes</strong> dans votre pipeline.</p>
<pre><code>-- Créer une streaming table, puis utiliser AUTO CDC pour la peupler
CREATE OR REFRESH STREAMING TABLE customers;

CREATE FLOW scd_type_1_flow AS
AUTO CDC INTO customers
FROM STREAM updates
KEYS (CustomerID)
APPLY AS DELETE WHEN operation = "DELETE"
SEQUENCE BY ProcessDate
COLUMNS * EXCEPT (operation)
STORED AS SCD TYPE 1;</code></pre>
<table class="tbl">
<thead><tr><th style="width:38%">Clause</th><th>Rôle</th></tr></thead>
<tbody>
<tr><td><code>CREATE OR REFRESH STREAMING TABLE customers;</code></td><td>Créer une streaming table, puis utiliser AUTO CDC pour la peupler.</td></tr>
<tr><td><code>AUTO CDC INTO customers</code></td><td>Applique les <strong>updates, inserts et deletes</strong> à la <strong>table cible</strong> nommée <code>customers</code>.</td></tr>
<tr><td><code>FROM STREAM updates</code></td><td>Les <strong>enregistrements source</strong> qui déterminent les updates, deletes et inserts (le flux source contenant les événements CDC).</td></tr>
<tr><td><code>KEYS (CustomerID)</code></td><td>La ou les <strong>colonnes qui identifient de façon unique une ligne</strong> dans les tables source et cible — la clé primaire utilisée pour apparier les lignes.</td></tr>
<tr><td><code>APPLY AS DELETE WHEN operation = "DELETE"</code></td><td>Spécifie <strong>quand un événement CDC doit être traité comme un DELETE</strong> plutôt qu'un <em>upsert</em>.</td></tr>
<tr><td><code>SEQUENCE BY ProcessDate</code></td><td>Spécifie l'<strong>ordre logique des événements CDC</strong> dans les données source — critique pour appliquer les changements dans la bonne séquence.</td></tr>
<tr><td><code>COLUMNS * EXCEPT (operation)</code></td><td>Spécifie un <strong>sous-ensemble de colonnes</strong> à inclure dans la cible (ici tout sauf l'indicateur d'opération CDC).</td></tr>
<tr><td><code>STORED AS SCD TYPE 1</code></td><td>Détermine s'il faut stocker les enregistrements en <strong>SCD type 1 (défaut)</strong> ou <strong>type 2</strong>. En SCD Type 2, l'historique des changements est conservé.</td></tr>
</tbody>
</table>
<div class="callout">
<strong>INSERTs et UPDATEs sont implémentés implicitement via la ou les KEY(s), aucun code requis.</strong><br/><br/>
Utilisez <strong><code>AUTO CDC INTO</code></strong> (anciennement <code>APPLY CHANGES INTO</code>) <strong>au lieu d'un job batch traditionnel avec la syntaxe complexe <code>MERGE INTO</code></strong>.<br/><br/>
Utilisez <strong><code>AUTO CDC FROM SNAPSHOT</code></strong> (Public Preview au Q2 2025) pour traiter les changements à partir de <em>snapshots</em> de base de données.
</div>

<h4>Le flow CDC final du projet</h4>
<p>Voici le dernier flow CDC que nous ajoutons à notre pipeline — <strong>Customers Flow</strong> :</p>
<ol>
<li><strong>Ingérer les fichiers JSON customers</strong> — faire entrer les données brutes dans le pipeline depuis le stockage cloud vers la streaming table <code>customers_bronze</code>.</li>
<li><strong>Créer la table <code>customers_bronze_clean</code></strong> — une streaming table nettoyée qui filtre et formate les updates, inserts et deletes incrémentaux issus de la streaming table <code>customers_bronze</code>.</li>
<li><strong>Utiliser <code>AUTO CDC INTO customers_silver</code></strong> :
  <ul>
    <li>utilise le <strong>SCD Type 1</strong> pour écraser les changements clients (updates, inserts et deletes) ;</li>
    <li>implémenté avec <code>AUTO CDC INTO</code> et <code>STORED AS SCD TYPE 1</code>.</li>
  </ul>
</li>
</ol>
<p>Ce flow final combine la logique CDC avec l'architecture Médaillon pour maintenir une table clients à jour (<strong>sans information historique</strong>), critique pour l'analytique en aval, la conformité et la personnalisation.</p>

<div class="demo"><span class="demo-label">STEP 1 — JSON → Bronze (ingestion Auto Loader)</span><p>Ingestion incrémentale des fichiers JSON du flux CDC vers une streaming table, en capturant l'horodatage de traitement et le fichier source :</p><pre><code>CREATE OR REFRESH STREAMING TABLE 1_bronze_db.customers_bronze_raw_demo6
  COMMENT "Raw data from customers CDC feed"
  TBLPROPERTIES (
    "quality" = "bronze",
    "pipelines.reset.allowed" = false   -- empêche un full refresh du bronze
  )
AS
SELECT
  *,
  current_timestamp()  AS processing_time,  -- horodatage d'ingestion des lignes
  _metadata.file_name  AS source_file       -- nom du fichier source
FROM STREAM read_files(
  "$\{source}/customers",
  format =&gt; "json"
);</code></pre></div>
<div class="demo"><span class="demo-label">STEP 2 — Bronze clean (enforcement qualité)</span><p>Table bronze nettoyée avec contraintes <code>EXPECT</code> : id non nul (<code>FAIL UPDATE</code>), opération non nulle et email valide (<code>DROP ROW</code>), nom/adresse en warn — sauf pour les suppressions :</p><pre><code>CREATE STREAMING TABLE 1_bronze_db.customers_bronze_clean_demo6
(
  CONSTRAINT valid_id        EXPECT (customer_id IS NOT NULL) ON VIOLATION FAIL UPDATE,
  CONSTRAINT valid_operation EXPECT (operation  IS NOT NULL) ON VIOLATION DROP ROW,
  CONSTRAINT valid_name      EXPECT (name IS NOT NULL OR operation = "DELETE"),
  CONSTRAINT valid_address   EXPECT (
    (address IS NOT NULL AND city IS NOT NULL AND
     state IS NOT NULL AND zip_code IS NOT NULL)
    OR operation = "DELETE"),
  CONSTRAINT valid_email     EXPECT (
    rlike(email, '^([a-zA-Z0-9_\\-\\.]+)@([a-zA-Z0-9_\\-\\.]+)\\.([a-zA-Z]{2,5})$')
    OR operation = "DELETE") ON VIOLATION DROP ROW
)
COMMENT "Clean raw bronze timestamp column and add data quality constraints"
AS
SELECT
  *,
  CAST(from_unixtime(timestamp) AS timestamp) AS timestamp_datetime
FROM STREAM 1_bronze_db.customers_bronze_raw_demo6;</code></pre></div>
<div class="demo"><span class="demo-label">STEP 3 — Bronze clean → Silver (AUTO CDC INTO, SCD Type 1)</span><p>On crée la table cible, puis un <code>CREATE FLOW</code> avec <code>AUTO CDC INTO</code> qui applique updates / deletes / inserts en ordonnant par <code>timestamp_datetime</code> :</p><pre><code>-- Créer la table cible si elle n'existe pas
CREATE OR REFRESH STREAMING TABLE 2_silver_db.scd_type_1_customers_silver_demo6
  COMMENT 'SCD Type 1 Historical Customer Data';

-- Appliquer le SCD Type 1
CREATE FLOW scd_type_1_flow AS
AUTO CDC INTO 2_silver_db.scd_type_1_customers_silver_demo6  -- table cible (SCD Type 1 ou 2)
FROM STREAM 1_bronze_db.customers_bronze_clean_demo6         -- source des changements
  KEYS (customer_id)                              -- clé primaire d'identification
  APPLY AS DELETE WHEN operation = "DELETE"       -- gestion des suppressions source -&gt; cible
  SEQUENCE BY timestamp_datetime                  -- ordre d'application des changements
  COLUMNS * EXCEPT (timestamp, _rescued_data, operation)   -- exclut les champs techniques
  STORED AS SCD TYPE 1;                           -- SCD Type 1 (pas d'historique)</code></pre><p class="demo-note">Remplacer par <code>STORED AS SCD TYPE 2</code> pour conserver l'historique des versions. La table cible doit exister <em>avant</em> le <code>CREATE FLOW</code>.</p></div>`
